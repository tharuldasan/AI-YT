<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Audio Visualizer & Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0c10;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      display: flex;
    }

    /* Background Display (No stretch, clean fit) */
    #bg-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
      background: #000;
    }

    .bg-image {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Maintains aspect ratio without distorting */
      position: absolute;
      opacity: 0;
      transition: opacity 1s ease-in-out, transform 0.3s ease;
      filter: brightness(0.6) contrast(1.1);
    }

    .bg-image.active {
      opacity: 1;
    }

    /* Audio Canvas Overlay */
    #visualizer-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Control Panel UI */
    #ui-container {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.85) 100%);
    }

    header {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
      background: rgba(20, 20, 20, 0.7);
      padding: 12px 20px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      font-size: 0.85rem;
      color: #45f3ff;
      font-weight: 600;
    }

    input, select, button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      outline: none;
      font-size: 0.85rem;
    }

    select option {
      background: #111;
      color: #fff;
    }

    button {
      cursor: pointer;
      background: #45f3ff;
      color: #000;
      font-weight: bold;
      border: none;
      transition: background 0.2s;
    }

    button:hover {
      background: #00c8d6;
    }

    /* Lyrics Display */
    #lyrics-container {
      text-align: center;
      margin: auto 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }

    #lyrics-text {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
      transition: all 0.3s ease;
    }

    #detected-lang-badge {
      font-size: 0.75rem;
      background: rgba(69, 243, 255, 0.2);
      color: #45f3ff;
      padding: 2px 8px;
      border-radius: 10px;
      display: inline-block;
      margin-bottom: 8px;
    }

    /* Footer Player Controls */
    footer {
      background: rgba(20, 20, 20, 0.8);
      padding: 15px 25px;
      border-radius: 16px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .timeline-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .timeline-container span {
      font-size: 0.8rem;
      font-weight: bold;
      min-width: 45px;
    }

    #progress-bar {
      flex: 1;
      accent-color: #45f3ff;
      cursor: pointer;
    }

    .picture-gallery-preview {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .thumb {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      cursor: pointer;
      opacity: 0.5;
      border: 2px solid transparent;
      transition: all 0.2s;
    }

    .thumb.active {
      opacity: 1;
      border-color: #45f3ff;
    }
  </style>
</head>
<body>

  <!-- Background Image Carousel -->
  <div id="bg-container">
    <img id="bg1" class="bg-image active" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=1200" alt="Music 1" />
    <img id="bg2" class="bg-image" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=1200" alt="Music 2" />
    <img id="bg3" class="bg-image" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=1200" alt="Music 3" />
    <img id="bg4" class="bg-image" src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=1200" alt="Music 4" />
  </div>

  <!-- Audio Visualizer Canvas -->
  <canvas id="visualizer-canvas"></canvas>

  <!-- Controls & UI Overlay -->
  <div id="ui-container">
    <header>
      <!-- Audio Input / Search -->
      <div class="control-group">
        <label for="audio-source-input">Audio URL / Search:</label>
        <input type="text" id="audio-source-input" placeholder="Paste Audio URL..." value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
        <button id="btn-load-url">Load</button>
      </div>

      <div class="control-group">
        <label for="audio-file">Upload File:</label>
        <input type="file" id="audio-file" accept="audio/*">
      </div>

      <!-- Frequency Range Slider -->
      <div class="control-group">
        <label for="freq-slider">Frequency Scale:</label>
        <input type="range" id="freq-slider" min="64" max="512" step="64" value="128">
      </div>

      <!-- Lyrics Language Selector -->
      <div class="control-group">
        <label for="lang-select">Lyrics Language:</label>
        <select id="lang-select">
          <option value="auto">Auto Detect (Multi-Lang)</option>
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="hi">Hindi</option>
          <option value="ja">Japanese</option>
        </select>
      </div>

      <!-- Genre Effects Theme -->
      <div class="control-group">
        <label for="genre-select">Genre Effect:</label>
        <select id="genre-select">
          <option value="edm">EDM (Neon Pulsing)</option>
          <option value="phonk">Phonk (Dark Bass Distortion)</option>
          <option value="funk">Funk (Teal & Gold Pulse)</option>
          <option value="ncs">NCS (Cyan Bright Wave)</option>
          <option value="charm" selected>Charm / Chill (Soft Pastels)</option>
        </select>
      </div>
    </header>

    <!-- Lyrics Display Center -->
    <div id="lyrics-container">
      <div id="detected-lang-badge">Detected: English</div>
      <div id="lyrics-text">🎵 Play audio to start synchronized visualizer...</div>
    </div>

    <!-- Bottom Audio Controls & Gallery Selection -->
    <footer>
      <div class="timeline-container">
        <button id="btn-play">Play</button>
        <span id="current-time">0:00</span>
        <input type="range" id="progress-bar" value="0" min="0" max="100">
        <span id="total-duration">0:00</span>
      </div>

      <div class="picture-gallery-preview">
        <img class="thumb active" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200" onclick="switchBg(0)">
        <img class="thumb" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=200" onclick="switchBg(1)">
        <img class="thumb" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=200" onclick="switchBg(2)">
        <img class="thumb" src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=200" onclick="switchBg(3)">
      </div>
    </footer>
  </div>

  <audio id="audio-element" crossOrigin="anonymous"></audio>

  <script>
    // --- Elements & Setup ---
    const audio = document.getElementById('audio-element');
    const playBtn = document.getElementById('btn-play');
    const progressBar = document.getElementById('progress-bar');
    const currentTimeEl = document.getElementById('current-time');
    const totalDurationEl = document.getElementById('total-duration');
    const canvas = document.getElementById('visualizer-canvas');
    const ctx = canvas.getContext('2d');
    const freqSlider = document.getElementById('freq-slider');
    const genreSelect = document.getElementById('genre-select');
    const langSelect = document.getElementById('lang-select');
    const detectedLangBadge = document.getElementById('detected-lang-badge');
    const lyricsText = document.getElementById('lyrics-text');

    let audioCtx, analyser, source;
    let currentBgIndex = 0;
    const bgImages = document.querySelectorAll('.bg-image');
    const thumbs = document.querySelectorAll('.thumb');

    // Fallback Image URLs in case external assets fail to load
    const fallbackImages = [
      'https://picsum.photos/id/1025/1200/800',
      'https://picsum.photos/id/1082/1200/800',
      'https://picsum.photos/id/1043/1200/800',
      'https://picsum.photos/id/1074/1200/800'
    ];

    // Guarantee Image Loading Success
    bgImages.forEach((img, idx) => {
      img.onerror = () => { img.src = fallbackImages[idx]; };
    });
    thumbs.forEach((img, idx) => {
      img.onerror = () => { img.src = fallbackImages[idx]; };
    });

    // Resize Canvas dynamically
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- Audio Context Initialization ---
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = parseInt(freqSlider.value) * 2;
        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
      }
    }

    // --- Audio Control & Time Handlers ---
    playBtn.addEventListener('click', () => {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      if (audio.paused) {
        audio.play();
        playBtn.textContent = 'Pause';
      } else {
        audio.pause();
        playBtn.textContent = 'Play';
      }
    });

    // Handle full song duration dynamically (3 min, 10 min, or short files)
    audio.addEventListener('loadedmetadata', () => {
      progressBar.max = Math.floor(audio.duration);
      totalDurationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration)) {
        progressBar.value = Math.floor(audio.currentTime);
        currentTimeEl.textContent = formatTime(audio.currentTime);
        updateLyrics(audio.currentTime);
      }
    });

    progressBar.addEventListener('input', () => {
      audio.currentTime = progressBar.value;
    });

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // --- Load Audio Sources ---
    document.getElementById('btn-load-url').addEventListener('click', () => {
      const url = document.getElementById('audio-source-input').value;
      if (url) {
        audio.src = url;
        audio.load();
        if (audioCtx) audio.play();
        playBtn.textContent = 'Pause';
      }
    });

    document.getElementById('audio-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        audio.src = URL.createObjectURL(file);
        audio.load();
        initAudio();
        audio.play();
        playBtn.textContent = 'Pause';
      }
    });

    // Slider Adjusts Audio Frequency Resolution
    freqSlider.addEventListener('input', () => {
      if (analyser) {
        analyser.fftSize = parseInt(freqSlider.value) * 2;
      }
    });

    // --- Background Switcher ---
    function switchBg(index) {
      bgImages[currentBgIndex].classList.remove('active');
      thumbs[currentBgIndex].classList.remove('active');
      currentBgIndex = index;
      bgImages[currentBgIndex].classList.add('active');
      thumbs[currentBgIndex].classList.add('active');
    }

    setInterval(() => {
      if (!audio.paused) {
        switchBg((currentBgIndex + 1) % bgImages.length);
      }
    }, 10000); // Smooth background transition every 10s

    // --- Lyrics & Language Auto-Detect Logic ---
    const sampleLyrics = [
      { time: 0, text: "🎵 (Instrumental Intro)", lang: "en" },
      { time: 5, text: "Feeling the bass beat inside your heart", lang: "en" },
      { time: 10, text: "ritmo de la noche bailando libre", lang: "es" },
      { time: 15, text: "दिल की धड़कन सुनो इस संगीत में", lang: "hi" },
      { time: 20, text: "音楽は決して止まらない", lang: "ja" },
      { time: 25, text: "Unstoppable rhythm taking over...", lang: "en" }
    ];

    function detectLanguage(text) {
      if (/[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff]/.test(text)) return "Japanese";
      if (/[\u0900-\u097F]/.test(text)) return "Hindi";
      if (/[ñáéíóúÁÉÍÓÚ]/i.test(text)) return "Spanish";
      return "English";
    }

    function updateLyrics(time) {
      const selectedLang = langSelect.value;
      const currentLyric = sampleLyrics.slice().reverse().find(l => time >= l.time);

      if (currentLyric) {
        const detected = detectLanguage(currentLyric.text);
        
        if (selectedLang === 'auto') {
          detectedLangBadge.textContent = `Auto Detected: ${detected}`;
          lyricsText.textContent = currentLyric.text;
        } else {
          detectedLangBadge.textContent = `Target Language: ${selectedLang.toUpperCase()}`;
          lyricsText.textContent = currentLyric.text; // Displays active line
        }
      }
    }

    // --- Render Center-Out Mirrored Audio Visualizer (No Rotation) ---
    function renderVisualizer() {
      requestAnimationFrame(renderVisualizer);

      // Clean transparent clear frame to avoid background going white
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!analyser) return;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      const theme = genreSelect.value;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const barWidth = (canvas.width / 2) / (bufferLength * 0.75);

      // Bass energy multiplier for genre reactivity
      let bassSum = 0;
      for (let i = 0; i < 10; i++) bassSum += dataArray[i];
      const bassEnergy = bassSum / 10 / 255;

      // Pulse background image slightly on strong bass
      if (bgImages[currentBgIndex]) {
        const scale = 1 + (bassEnergy * (theme === 'phonk' || theme === 'edm' ? 0.08 : 0.03));
        bgImages[currentBgIndex].style.transform = `scale(${scale})`;
      }

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * (canvas.height * 0.45);

        // Center-to-Right offset
        const xRight = centerX + (i * barWidth);
        // Center-to-Left offset (Mirrored)
        const xLeft = centerX - (i * barWidth) - barWidth;

        // Apply Genre Color Themes
        ctx.fillStyle = getGenreColor(theme, i, bufferLength, dataArray[i]);
        ctx.shadowBlur = theme === 'edm' || theme === 'ncs' ? 15 : 5;
        ctx.shadowColor = ctx.fillStyle;

        // Draw Right Side Line
        ctx.fillRect(xRight, centerY - barHeight / 2, barWidth - 1, barHeight);
        // Draw Left Side Line (Mirrored)
        ctx.fillRect(xLeft, centerY - barHeight / 2, barWidth - 1, barHeight);
      }
    }

    // Palette Generator based on Selected Genre
    function getGenreColor(theme, index, total, value) {
      const ratio = index / total;
      switch (theme) {
        case 'edm': // Neon Pink & Cyan
          return `hsl(${180 + ratio * 120}, 100%, ${50 + (value / 255) * 20}%)`;
        case 'phonk': // Dark Red & Deep Purple
          return `hsl(${280 + ratio * 80}, 90%, ${30 + (value / 255) * 40}%)`;
        case 'funk': // Teal, Gold, & Orange
          return `hsl(${30 + ratio * 140}, 100%, ${50 + (value / 255) * 20}%)`;
        case 'ncs': // Electric Cyan & Bright Yellow
          return `hsl(${50 + ratio * 130}, 100%, 60%)`;
        case 'charm': // Soft Pastel Glow
        default:
          return `hsl(${200 + ratio * 60}, 70%, ${65 + (value / 255) * 20}%)`;
      }
    }

    // Start Visualizer Rendering Loop
    renderVisualizer();
  </script>
</body>
</html>
