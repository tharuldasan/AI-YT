<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA // V2 AUTOMATED SHORTS ENGINE</title>
    <style>
        :root {
            --bg: #05070f;
            --card: #0d111d;
            --primary: #00f0ff;
            --text: #f8fafc;
            --border: #1e293b;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .panel {
            background: var(--card);
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 4px; color: var(--primary); font-size: 22px; letter-spacing: 2px; text-transform: uppercase; }
        .subtitle { font-size: 11px; color: #64748b; margin-bottom: 20px; letter-spacing: 1px; }
        label { display: block; margin: 12px 0 6px; font-size: 13px; font-weight: 700; text-transform: uppercase; color: #94a3b8; }
        input[type="text"], input[type="color"], select {
            width: 100%; padding: 12px; background: #05070f; border: 1px solid var(--border);
            border-radius: 6px; color: #fff; box-sizing: border-box; font-size: 14px;
        }
        input[type="range"] { width: 100%; margin-bottom: 5px; }
        .search-group { display: flex; gap: 8px; }
        .search-group button { width: auto; white-space: nowrap; }
        .canvas-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border);
            width: 360px; 
            height: 640px; 
            position: relative;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
        }
        canvas { width: 100%; height: 100%; display: block; }
        button {
            width: 100%; padding: 14px; margin-top: 12px;
            background: linear-gradient(135deg, var(--primary), #0072ff);
            color: #000; border: none; border-radius: 6px; font-weight: 900;
            letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
            transition: all 0.2s ease;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button.record { background: linear-gradient(135deg, #ff0055, #ff0000); color: white; }
        button:disabled { background: #334155; color: #64748b; cursor: not-allowed; transform: none; }
        .file-inputs { margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border); }
        .value-display { font-size: 12px; color: var(--primary); float: right; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>⚡ AURA ENGINE V2</h1>
        <div class="subtitle">AUTOMATED VISUALIZER & SHORTS GENERATOR</div>
        
        <label>1. Search Song Online (Auto-Fetches Official BG):</label>
        <div class="search-group">
            <input type="text" id="songQuery" placeholder="e.g. Metamorphosis Phonk">
            <button onclick="searchSong()">Search</button>
        </div>

        <div class="file-inputs">
            <label>2. Main Theme Color:</label>
            <input type="color" id="themeColor" value="#00f0ff">
            
            <label>Playback Speed (Slowed): <span class="value-display" id="speedVal">1.0x</span></label>
            <input type="range" id="speedSlider" min="0.5" max="1.5" step="0.05" value="1.0">
            
            <label>Center Logo Size: <span class="value-display" id="logoSizeVal">240px</span></label>
            <input type="range" id="logoSizeSlider" min="150" max="450" step="10" value="240">

            <label>Optional: Upload Custom BG (Overrides Official):</label>
            <input type="file" id="bgInput" accept="image/*">
            
            <label>Optional: Upload Custom Logo (Overrides logo.png):</label>
            <input type="file" id="logoInput" accept="image/*">

            <label>Or Local MP3 File:</label>
            <input type="file" id="audioInput" accept="audio/*">
        </div>

        <button id="playBtn" disabled>▶️ PLAY & PREVIEW</button>
        <button id="recordBtn" class="record" disabled>🔴 RECORD SHORTS VIDEO (.WEBM)</button>
        <div id="status" style="font-size: 11px; color: #00f0ff; margin-top: 10px; text-align: center;"></div>
    </div>

    <div class="canvas-container">
        <!-- Render resolution strictly set to 1080x1920 vertical -->
        <canvas id="visualizer" width="1080" height="1920"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        // Assets & State
        let bgImg = new Image();
        let logoImg = new Image();
        logoImg.src = 'logo.png'; // Automatically looks for logo.png in the same folder
        
        let particles = [];
        let themeColor = "#00f0ff";
        let logoBaseSize = 240;

        // Web Audio
        let audioCtx, source, analyser, gainNode, mediaDest;
        let audioBuffer = null;
        let isPlaying = false;
        let startTime = 0;

        // Recording
        let mediaRecorder;
        let recordedChunks = [];

        // UI Elements
        const statusTxt = document.getElementById('status');
        const playBtn = document.getElementById('playBtn');
        const recordBtn = document.getElementById('recordBtn');
        const speedSlider = document.getElementById('speedSlider');
        const logoSizeSlider = document.getElementById('logoSizeSlider');

        // Init Particles (Bigger size per your request)
        for(let i = 0; i < 70; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 8 + 3, // Increased size
                speedY: Math.random() * -3 - 1.5,
                speedX: Math.random() * 2 - 1,
                opacity: Math.random()
            });
        }

        // Event Listeners for UI
        document.getElementById('themeColor').addEventListener('input', (e) => {
            themeColor = e.target.value;
            document.documentElement.style.setProperty('--primary', themeColor);
        });
        
        speedSlider.addEventListener('input', (e) => {
            document.getElementById('speedVal').innerText = e.target.value + 'x';
            if (source) source.playbackRate.value = e.target.value;
        });

        logoSizeSlider.addEventListener('input', (e) => {
            logoBaseSize = parseInt(e.target.value);
            document.getElementById('logoSizeVal').innerText = logoBaseSize + 'px';
        });

        // Image Loaders
        document.getElementById('bgInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) bgImg.src = URL.createObjectURL(file);
        });
        document.getElementById('logoInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) logoImg.src = URL.createObjectURL(file);
        });

        // Online Song Search (iTunes Preview API - Zero Key Required)
        async function searchSong() {
            const query = document.getElementById('songQuery').value;
            if(!query) return;
            statusTxt.innerText = "Searching online audio...";

            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=1`);
                const data = await res.json();
                
                if(data.results.length === 0) {
                    statusTxt.innerText = "No track found. Try local file upload.";
                    return;
                }

                const track = data.results[0];
                statusTxt.innerText = `Loaded: ${track.trackName} - ${track.artistName}`;
                
                // Fetch Official High-Res Background Image (1000x1000)
                if(!document.getElementById('bgInput').files.length) {
                    const highResArt = track.artworkUrl100.replace('100x100bb', '1000x1000bb');
                    bgImg.src = highResArt;
                }

                // Fetch Audio Stream
                const audioRes = await fetch(track.previewUrl);
                const arrayBuffer = await audioRes.arrayBuffer();
                
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                
                playBtn.disabled = false;
            } catch(err) {
                statusTxt.innerText = "Error fetching song: " + err.message;
            }
        }

        // Local Audio Loader
        document.getElementById('audioInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            statusTxt.innerText = "Decoding local audio file...";
            
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await file.arrayBuffer();
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            
            playBtn.disabled = false;
            statusTxt.innerText = "Local file loaded!";
        });

        // Setup Audio Pipeline (No Bass Boost, just original audio + fades)
        function setupAudio() {
            source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.playbackRate.value = speedSlider.value;

            gainNode = audioCtx.createGain(); // Controls volume for fade in/out
            gainNode.gain.value = 0; // Start at 0 for fade in

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256; 
            analyser.smoothingTimeConstant = 0.85; // Extra smooth for curved spectrum

            mediaDest = audioCtx.createMediaStreamDestination();

            // source -> gain (fade) -> analyser -> destination
            source.connect(gainNode);
            gainNode.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.connect(mediaDest);
        }

        // Play / Pause Logic
        playBtn.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) {
                source.stop();
                isPlaying = false;
                playBtn.innerText = "▶️ PLAY & PREVIEW";
                recordBtn.disabled = true;
            } else {
                setupAudio();
                source.start(0);
                startTime = audioCtx.currentTime;
                isPlaying = true;
                playBtn.innerText = "⏸️ STOP AUDIO";
                recordBtn.disabled = false;
                renderFrame();
            }
        });

        // Main Visualizer Render Loop
        function renderFrame() {
            if (!isPlaying) return;
            requestAnimationFrame(renderFrame);

            // Handle Global Fades (Visual and Audio Sync)
            let elapsed = audioCtx.currentTime - startTime;
            let currentSpeed = parseFloat(speedSlider.value);
            let actualDuration = audioBuffer.duration / currentSpeed;
            
            let fadeAlpha = 1;
            if (elapsed < 2) fadeAlpha = elapsed / 2; // 2 sec fade in
            else if (actualDuration - elapsed < 2) fadeAlpha = Math.max(0, (actualDuration - elapsed) / 2); // 2 sec fade out
            
            // Apply Fade to Audio
            if (gainNode) gainNode.gain.value = fadeAlpha;
            
            // Stop logic when track ends
            if (elapsed >= actualDuration) {
                isPlaying = false;
                playBtn.innerText = "▶️ PLAY & PREVIEW";
                if(mediaRecorder && mediaRecorder.state === 'recording') recordBtn.click(); // Auto-stop recording
                return;
            }

            // Get Frequency Data
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            // Calculate Bass Kick Intensity
            let bassSum = 0;
            for(let i = 0; i < 5; i++) bassSum += dataArray[i];
            let bassIntensity = bassSum / 5; 
            let kick = bassIntensity > 200 ? (bassIntensity - 200) / 55 : 0; 

            // Clear Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Apply Visual Fade (Global Alpha)
            ctx.globalAlpha = fadeAlpha;

            // 1. Camera Shake Effect
            ctx.save();
            let shakeX = (Math.random() - 0.5) * kick * 20;
            let shakeY = (Math.random() - 0.5) * kick * 20;
            ctx.translate(shakeX, shakeY);

            // 2. Background Drawing (Perfect Fit/Cover)
            if (bgImg.src && bgImg.complete) {
                let scale = Math.max(canvas.width / bgImg.width, canvas.height / bgImg.height);
                let x = (canvas.width / 2) - (bgImg.width / 2) * scale;
                let y = (canvas.height / 2) - (bgImg.height / 2) * scale;
                ctx.drawImage(bgImg, x, y, bgImg.width * scale, bgImg.height * scale);
            } else {
                ctx.fillStyle = "#05070f";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 3. Color Tint Overlay (No white flashes anymore)
            ctx.fillStyle = themeColor;
            ctx.globalCompositeOperation = "color";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = "source-over";

            // 4. Particles Engine (Bigger, flowing upward)
            ctx.fillStyle = themeColor;
            for(let p of particles) {
                p.y += p.speedY - (kick * 3);
                p.x += p.speedX;
                if(p.y < 0) p.y = canvas.height + p.size;
                if(p.x < 0 || p.x > canvas.width) p.x = Math.random() * canvas.width;

                ctx.globalAlpha = p.opacity * fadeAlpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size + (kick * 3), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = fadeAlpha; // Reset alpha to just the fade

            // 5. Setup Center Specs
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const currentRadius = logoBaseSize + (kick * 25);

            // 6. Highly Effective Curved Symmetrical Spectrum (Trap Nation / Vizzy Style)
            let numBars = 55; // Number of points per side
            ctx.beginPath();
            
            // Right side of the spectrum (Top to Bottom)
            for (let i = 0; i <= numBars; i++) {
                let val = dataArray[i]; 
                let height = (val / 255) * 160 * (1 + kick * 0.3);
                let r = currentRadius + height;
                let angle = (i / numBars) * Math.PI - Math.PI / 2; // -90 to +90 degrees
                
                let px = cx + Math.cos(angle) * r;
                let py = cy + Math.sin(angle) * r;
                if(i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }

            // Left side of the spectrum (Bottom back to Top)
            for (let i = numBars; i >= 0; i--) {
                let val = dataArray[i];
                let height = (val / 255) * 160 * (1 + kick * 0.3);
                let r = currentRadius + height;
                let angle = Math.PI / 2 + ((numBars - i) / numBars) * Math.PI; // +90 to +270 degrees
                
                let px = cx + Math.cos(angle) * r;
                let py = cy + Math.sin(angle) * r;
                ctx.lineTo(px, py);
            }
            ctx.closePath();
            
            // Draw Spectrum Fill with Effects
            ctx.fillStyle = themeColor;
            ctx.shadowBlur = 40 + (kick * 40);
            ctx.shadowColor = themeColor;
            ctx.fill();
            ctx.shadowBlur = 0; // reset glow

            // 7. Black Inner Ring Background (Masks the inside of the spectrum)
            ctx.beginPath();
            ctx.arc(cx, cy, currentRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#000000";
            ctx.fill();
            
            // 8. Draw Center Logo (Scaled by UI Slider)
            if (logoImg.src && logoImg.complete && logoImg.naturalWidth !== 0) {
                // Ensure logo scales correctly within the radius bounds
                let logoDrawSize = currentRadius * 1.6; 
                ctx.save();
                ctx.beginPath();
                ctx.arc(cx, cy, currentRadius - 4, 0, Math.PI * 2); // Clip to inner circle
                ctx.clip();
                ctx.drawImage(logoImg, cx - logoDrawSize/2, cy - logoDrawSize/2, logoDrawSize, logoDrawSize);
                ctx.restore();
            }

            ctx.restore(); // Restore camera shake matrix
        }

        // Recording Functionality
        recordBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                recordBtn.innerText = "🔴 RECORD SHORTS VIDEO (.WEBM)";
                statusTxt.innerText = "Encoding video file...";
                return;
            }

            const canvasStream = canvas.captureStream(30);
            const combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(), 
                ...mediaDest.stream.getAudioTracks()
            ]);

            mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
            recordedChunks = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `AURA_SHORTS_${Date.now()}.webm`;
                a.click();
                URL.revokeObjectURL(url);
                statusTxt.innerText = "Aura Shorts Video Exported!";
            };

            mediaRecorder.start();
            recordBtn.innerText = "⏹️ STOP & SAVE SHORTS VIDEO";
            statusTxt.innerText = "Recording video in high-quality 1080x1920...";
        });
    </script>
</body>
</html>
