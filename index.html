<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA // V4 AUTOMATED SHORTS ENGINE</title>
    <style>
        :root {
            --bg: #05070f; --card: #0d111d; --primary: #00f0ff;
            --text: #f8fafc; --border: #1e293b;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg); color: var(--text);
            margin: 0; padding: 20px; display: flex; gap: 20px;
            justify-content: center; flex-wrap: wrap;
        }
        .panel {
            background: var(--card); padding: 24px; border-radius: 12px;
            width: 100%; max-width: 420px; border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 4px; color: var(--primary); font-size: 22px; letter-spacing: 2px; text-transform: uppercase; }
        .subtitle { font-size: 11px; color: #64748b; margin-bottom: 20px; letter-spacing: 1px; }
        label { display: block; margin: 12px 0 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; color: #94a3b8; }
        input[type="text"], input[type="color"] {
            width: 100%; padding: 12px; background: #05070f; border: 1px solid var(--border);
            border-radius: 6px; color: #fff; box-sizing: border-box; font-size: 14px;
        }
        input[type="range"] { width: 100%; margin-bottom: 5px; cursor: pointer; }
        .search-group { display: flex; gap: 8px; }
        .search-group button { width: auto; white-space: nowrap; }
        .canvas-container {
            background: #000; border-radius: 12px; overflow: hidden;
            border: 2px solid var(--border); width: 360px; height: 640px; 
            position: relative; box-shadow: 0 0 50px rgba(0, 240, 255, 0.15);
        }
        canvas { width: 100%; height: 100%; display: block; }
        button {
            width: 100%; padding: 14px; margin-top: 12px;
            background: linear-gradient(135deg, var(--primary), #0072ff);
            color: #000; border: none; border-radius: 6px; font-weight: 900;
            letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
            transition: all 0.2s ease;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button.record { background: linear-gradient(135deg, #ff0055, #ff0000); color: white; }
        button:disabled { background: #334155; color: #64748b; cursor: not-allowed; transform: none; }
        .file-inputs { margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border); }
        .color-group { display: flex; gap: 10px; }
        .color-group div { flex: 1; }
        .value-display { font-size: 12px; color: var(--primary); float: right; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>⚡ AURA ENGINE V4</h1>
        <div class="subtitle">SMOOTH MIRRORED SPECTRUM & KINETIC BASS</div>
        
        <label>1. Search Song Online (Auto-Fetches Official BG):</label>
        <div class="search-group">
            <input type="text" id="songQuery" placeholder="e.g. Metamorphosis Phonk">
            <button onclick="searchSong()">Search</button>
        </div>

        <div class="file-inputs">
            <div class="color-group">
                <div>
                    <label>Outer Glow Color:</label>
                    <input type="color" id="themeColor" value="#00f0ff">
                </div>
                <div>
                    <label>Inner Fill Color:</label>
                    <input type="color" id="innerColor" value="#000000">
                </div>
            </div>
            
            <label>Playback Speed (Slowed): <span class="value-display" id="speedVal">1.0x</span></label>
            <input type="range" id="speedSlider" min="0.5" max="1.5" step="0.05" value="1.0">
            
            <label>Inner Logo Picture Size: <span class="value-display" id="logoSizeVal">240px</span></label>
            <input type="range" id="logoSizeSlider" min="100" max="400" step="10" value="240">

            <label>Optional: Custom BG (Overrides Official):</label>
            <input type="file" id="bgInput" accept="image/*">
            
            <label>Optional: Custom Logo (Overrides logo.png):</label>
            <input type="file" id="logoInput" accept="image/*">

            <label>Or Local MP3 File:</label>
            <input type="file" id="audioInput" accept="audio/*">
        </div>

        <button id="playBtn" disabled>▶️ PLAY & PREVIEW</button>
        <button id="recordBtn" class="record" disabled>🔴 RECORD SHORTS VIDEO (.WEBM)</button>
        <div id="status" style="font-size: 11px; color: #00f0ff; margin-top: 10px; text-align: center;"></div>
    </div>

    <div class="canvas-container">
        <!-- Render resolution strictly set to 1080x1920 vertical -->
        <canvas id="visualizer" width="1080" height="1920"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        // Assets & State
        let bgImg = new Image();
        let logoImg = new Image();
        logoImg.src = 'logo.png'; 
        
        let particles = [];
        let themeColor = "#00f0ff";
        let innerColor = "#000000";
        let innerLogoSize = 240;

        // Web Audio
        let audioCtx, source, analyser, gainNode, mediaDest;
        let audioBuffer = null;
        let isPlaying = false;
        let startTime = 0;

        // Recording
        let mediaRecorder;
        let recordedChunks = [];

        // UI Elements
        const statusTxt = document.getElementById('status');
        const playBtn = document.getElementById('playBtn');
        const recordBtn = document.getElementById('recordBtn');
        const speedSlider = document.getElementById('speedSlider');
        const logoSizeSlider = document.getElementById('logoSizeSlider');

        // Init Dust Particles for depth
        for(let i = 0; i < 75; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 4 + 1, 
                speedY: Math.random() * -2 - 1,
                speedX: (Math.random() - 0.5) * 1.5,
                opacity: Math.random() * 0.5 + 0.1
            });
        }

        // Event Listeners for UI
        document.getElementById('themeColor').addEventListener('input', (e) => {
            themeColor = e.target.value;
            document.documentElement.style.setProperty('--primary', themeColor);
        });
        
        document.getElementById('innerColor').addEventListener('input', (e) => {
            innerColor = e.target.value;
        });
        
        speedSlider.addEventListener('input', (e) => {
            document.getElementById('speedVal').innerText = e.target.value + 'x';
            if (source) source.playbackRate.value = e.target.value;
        });

        logoSizeSlider.addEventListener('input', (e) => {
            innerLogoSize = parseInt(e.target.value);
            document.getElementById('logoSizeVal').innerText = innerLogoSize + 'px';
        });

        document.getElementById('bgInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) bgImg.src = URL.createObjectURL(file);
        });
        document.getElementById('logoInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) logoImg.src = URL.createObjectURL(file);
        });

        // Online Song Search
        async function searchSong() {
            const query = document.getElementById('songQuery').value;
            if(!query) return;
            statusTxt.innerText = "Searching online audio...";

            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=1`);
                const data = await res.json();
                if(data.results.length === 0) return statusTxt.innerText = "No track found.";

                const track = data.results[0];
                statusTxt.innerText = `Loaded: ${track.trackName} - ${track.artistName}`;
                
                if(!document.getElementById('bgInput').files.length) {
                    bgImg.src = track.artworkUrl100.replace('100x100bb', '1000x1000bb');
                }

                const audioRes = await fetch(track.previewUrl);
                const arrayBuffer = await audioRes.arrayBuffer();
                
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                playBtn.disabled = false;
            } catch(err) {
                statusTxt.innerText = "Error: " + err.message;
            }
        }

        // Local Audio Loader
        document.getElementById('audioInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            statusTxt.innerText = "Decoding local audio file...";
            
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await file.arrayBuffer();
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            
            playBtn.disabled = false;
            statusTxt.innerText = "Local file loaded!";
        });

        function setupAudio() {
            source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.playbackRate.value = speedSlider.value;

            gainNode = audioCtx.createGain(); 
            gainNode.gain.value = 0; 

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256; 
            // Extreme smoothing for that fluid Vizzy look
            analyser.smoothingTimeConstant = 0.88; 

            mediaDest = audioCtx.createMediaStreamDestination();

            source.connect(gainNode);
            gainNode.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.connect(mediaDest);
        }

        playBtn.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) {
                source.stop();
                isPlaying = false;
                playBtn.innerText = "▶️ PLAY & PREVIEW";
                recordBtn.disabled = true;
            } else {
                setupAudio();
                source.start(0);
                startTime = audioCtx.currentTime;
                isPlaying = true;
                playBtn.innerText = "⏸️ STOP AUDIO";
                recordBtn.disabled = false;
                renderFrame();
            }
        });

        // Smooth Bezier Curve Drawing Function
        function drawSmoothCurve(ctx, points) {
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            
            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                let nextP = points[(i + 1) % points.length];
                // Calculate midpoint to act as a smooth anchor
                let xc = (p.x + nextP.x) / 2;
                let yc = (p.y + nextP.y) / 2;
                ctx.quadraticCurveTo(p.x, p.y, xc, yc);
            }
            ctx.closePath();
        }

        function renderFrame() {
            if (!isPlaying) return;
            requestAnimationFrame(renderFrame);

            let elapsed = audioCtx.currentTime - startTime;
            let currentSpeed = parseFloat(speedSlider.value);
            let actualDuration = audioBuffer.duration / currentSpeed;
            
            let fadeAlpha = 1;
            if (elapsed < 1.5) fadeAlpha = elapsed / 1.5; 
            else if (actualDuration - elapsed < 1.5) fadeAlpha = Math.max(0, (actualDuration - elapsed) / 1.5); 
            
            if (gainNode) gainNode.gain.value = fadeAlpha;
            
            if (elapsed >= actualDuration) {
                isPlaying = false;
                playBtn.innerText = "▶️ PLAY & PREVIEW";
                if(mediaRecorder && mediaRecorder.state === 'recording') recordBtn.click();
                return;
            }

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            // BASS ISOLATION: Average only the lowest frequencies (bins 0 to 4)
            let bassSum = 0;
            for(let i = 0; i < 5; i++) bassSum += dataArray[i];
            let bassIntensity = bassSum / 5; 
            
            // STRICT SHAKE TRIGGER: Only happens on hard kicks
            let kick = bassIntensity > 220 ? (bassIntensity - 220) / 35 : 0; 

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = fadeAlpha;

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // 1. Kinetic Camera Shake (Translational + Rotational tied strictly to kick)
            ctx.save();
            let shakeX = (Math.random() - 0.5) * kick * 60;
            let shakeY = (Math.random() - 0.5) * kick * 60;
            let rotationAngle = (Math.random() - 0.5) * kick * 0.05; 
            
            ctx.translate(cx + shakeX, cy + shakeY);
            ctx.rotate(rotationAngle);
            ctx.translate(-cx, -cy);

            // 2. Background Drawing (Scaled up to cover edges during shake)
            if (bgImg.src && bgImg.complete) {
                let scale = Math.max(canvas.width / bgImg.width, canvas.height / bgImg.height) * 1.15;
                let x = (canvas.width / 2) - (bgImg.width / 2) * scale;
                let y = (canvas.height / 2) - (bgImg.height / 2) * scale;
                ctx.drawImage(bgImg, x, y, bgImg.width * scale, bgImg.height * scale);
            } else {
                ctx.fillStyle = "#05070f";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 3. Cinematic Vignette & Color Bleed Layer
            let grad = ctx.createRadialGradient(cx, cy, 300, cx, cy, 1200);
            grad.addColorStop(0, "transparent");
            grad.addColorStop(1, "rgba(0,0,0,0.85)");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Pulse color overlay on beat
            ctx.fillStyle = themeColor;
            ctx.globalCompositeOperation = "overlay";
            ctx.globalAlpha = (kick * 0.5) * fadeAlpha;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = "source-over";
            ctx.globalAlpha = fadeAlpha;

            // 4. Floating Dust Particles
            ctx.fillStyle = themeColor;
            for(let p of particles) {
                p.y += p.speedY - (kick * 8);
                p.x += p.speedX;
                if(p.y < 0) p.y = canvas.height + p.size;
                if(p.x < 0 || p.x > canvas.width) p.x = Math.random() * canvas.width;

                ctx.globalAlpha = p.opacity * fadeAlpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size + (kick * 3), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = fadeAlpha;

            // 5. Smooth, Solid Mirrored Spectrum Shape
            const spectrumBaseRadius = 250; 
            const numPoints = 40; // Number of points per half
            let points = [];

            // Calculate points: Top to Bottom (Right Side)
            for(let i = 0; i <= numPoints; i++) {
                let val = dataArray[i]; // Grab frequency
                let height = (val / 255) * 160 * (1 + kick * 0.3); // Map to pixel height
                let r = spectrumBaseRadius + height;
                let angle = -Math.PI / 2 + (i / numPoints) * Math.PI; // -90 to 90 degrees
                points.push({
                    x: cx + Math.cos(angle) * r,
                    y: cy + Math.sin(angle) * r
                });
            }

            // Calculate points: Bottom to Top (Left Side - MIRRORED)
            for(let i = numPoints - 1; i >= 0; i--) {
                let val = dataArray[i]; // Use exactly the same data for perfect mirror
                let height = (val / 255) * 160 * (1 + kick * 0.3);
                let r = spectrumBaseRadius + height;
                let angle = Math.PI / 2 + ((numPoints - i) / numPoints) * Math.PI; // 90 to 270 degrees
                points.push({
                    x: cx + Math.cos(angle) * r,
                    y: cy + Math.sin(angle) * r
                });
            }

            // Draw the customized filled shape
            drawSmoothCurve(ctx, points);
            
            // Set Inner Fill Color
            ctx.fillStyle = innerColor;
            ctx.fill();

            // Set Outer Glowing Line Color
            ctx.strokeStyle = themeColor;
            ctx.lineWidth = 6 + (kick * 4);
            ctx.shadowBlur = 25 + (kick * 30);
            ctx.shadowColor = themeColor;
            ctx.stroke();
            ctx.shadowBlur = 0; // Reset glow

            // 6. Draw Independent Inner Logo
            if (logoImg.src && logoImg.complete && logoImg.naturalWidth !== 0) {
                // Size controlled exclusively by the slider, plus a tiny bass pump
                let currentLogoSize = innerLogoSize + (kick * 10); 
                
                ctx.save();
                ctx.beginPath();
                // Ensure the image never bleeds outside the base spectrum circle
                ctx.arc(cx, cy, spectrumBaseRadius - 2, 0, Math.PI * 2); 
                ctx.clip();
                ctx.drawImage(logoImg, cx - currentLogoSize/2, cy - currentLogoSize/2, currentLogoSize, currentLogoSize);
                ctx.restore();
            }

            ctx.restore(); // Restore camera matrix
        }

        // Recording Functionality
        recordBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                recordBtn.innerText = "🔴 RECORD SHORTS VIDEO (.WEBM)";
                statusTxt.innerText = "Encoding video file...";
                return;
            }

            const canvasStream = canvas.captureStream(30);
            const combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(), 
                ...mediaDest.stream.getAudioTracks()
            ]);

            mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
            recordedChunks = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `AURA_SHORTS_${Date.now()}.webm`;
                a.click();
                URL.revokeObjectURL(url);
                statusTxt.innerText = "Aura Shorts Video Exported!";
            };

            mediaRecorder.start();
            recordBtn.innerText = "⏹️ STOP & SAVE SHORTS VIDEO";
            statusTxt.innerText = "Recording video in high-quality 1080x1920...";
        });
    </script>
</body>
</html>
