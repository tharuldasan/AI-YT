<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA // 7CLOUDS FULL SONG & MULTI-BG LYRIC ENGINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070f;
            --card: #0d111d;
            --primary: #ff0055;
            --accent: #00f0ff;
            --text: #f8fafc;
            --border: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        
        /* Control Panel */
        .panel {
            background: var(--card);
            padding: 24px;
            border-radius: 14px;
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--border);
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        h1 { color: var(--primary); font-size: 20px; letter-spacing: 2px; text-transform: uppercase; }
        .subtitle { font-size: 11px; color: #64748b; letter-spacing: 1px; margin-top: -10px; }
        
        label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; display: block; margin-bottom: 6px; }
        
        input[type="text"], input[type="file"] {
            width: 100%; padding: 12px; background: #05070f; border: 1px solid var(--border);
            border-radius: 8px; color: #fff; font-size: 13px;
        }
        
        .search-group { display: flex; gap: 8px; }
        
        button {
            padding: 12px 18px; background: linear-gradient(135deg, var(--primary), #ff7b00);
            color: #fff; border: none; border-radius: 8px; font-weight: 800;
            cursor: pointer; text-transform: uppercase; transition: all 0.2s ease;
            font-size: 12px;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { background: #334155; color: #64748b; cursor: not-allowed; transform: none; }
        
        /* Song Selection List */
        .results-list {
            max-height: 140px; overflow-y: auto; background: #05070f;
            border: 1px solid var(--border); border-radius: 8px;
            display: flex; flex-direction: column; gap: 4px; padding: 6px;
        }
        .track-item {
            padding: 8px 10px; background: #0d111d; border-radius: 6px; cursor: pointer;
            font-size: 12px; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid transparent; transition: all 0.2s;
        }
        .track-item:hover, .track-item.active {
            border-color: var(--primary); background: rgba(255, 0, 85, 0.1);
        }
        .track-info { display: flex; flex-direction: column; overflow: hidden; white-space: nowrap; }
        .track-title { font-weight: 700; color: #fff; text-overflow: ellipsis; overflow: hidden; }
        .track-artist { font-size: 10px; color: #64748b; }

        /* Background Selection Grid */
        .bg-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
        }
        .bg-thumb {
            width: 100%; aspect-ratio: 16/9; border-radius: 6px; object-fit: cover;
            cursor: pointer; border: 2px solid transparent; transition: all 0.2s;
            background: #05070f;
        }
        .bg-thumb:hover, .bg-thumb.active {
            border-color: var(--accent); transform: scale(1.05); box-shadow: 0 0 12px rgba(0,240,255,0.4);
        }

        /* Canvas Box */
        .canvas-container {
            background: #000; border-radius: 14px; overflow: hidden;
            border: 2px solid var(--border);
            width: 854px; height: 480px; /* CSS scale for 1920x1080 */
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.15);
            position: relative;
        }
        canvas { width: 100%; height: 100%; display: block; }
        
        #status { font-size: 11px; color: var(--accent); text-align: center; min-height: 24px; }
        .full-mp3-box { border-top: 1px dashed var(--border); padding-top: 10px; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>⚡ AURA LYRIC ENGINE</h1>
        <div class="subtitle">16:9 LANDSCAPE • MULTI-TRACK • MULTI-BG</div>
        
        <!-- 1. Song Search -->
        <div>
            <label>1. Search Song Name / Artist:</label>
            <div class="search-group">
                <input type="text" id="songQuery" placeholder="e.g. Starboy Weeknd">
                <button onclick="searchMusic()">Search</button>
            </div>
        </div>

        <!-- 2. Select Music Result -->
        <div>
            <label>2. Select Song Track Result:</label>
            <div class="results-list" id="songResults">
                <div style="font-size:11px; color:#64748b; padding:10px; text-align:center;">Search for a song to view tracks...</div>
            </div>
        </div>

        <!-- 3. Select Background -->
        <div>
            <label>3. Select Preferred AI Background:</label>
            <div class="bg-grid" id="bgGrid">
                <div style="grid-column: span 4; font-size:11px; color:#64748b; text-align:center; padding:10px; background:#05070f; border-radius:6px;">Backgrounds load after searching...</div>
            </div>
        </div>

        <!-- 4. Optional Full MP3 Override -->
        <div class="full-mp3-box">
            <label>Optional: Upload Full Song MP3 (Syncs with Lyrics):</label>
            <input type="file" id="fullMp3Input" accept="audio/*">
        </div>

        <div id="status">Ready</div>

        <button id="playBtn" disabled>▶️ PLAY 16:9 LYRIC VIDEO</button>
    </div>

    <!-- Canvas Preview (1920x1080 Native) -->
    <div class="canvas-container">
        <canvas id="visualizer" width="1920" height="1080"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const statusTxt = document.getElementById('status');
        const playBtn = document.getElementById('playBtn');
        const songResultsContainer = document.getElementById('songResults');
        const bgGridContainer = document.getElementById('bgGrid');

        let bgImg = new Image();
        let audioCtx, source, analyser;
        let audioBuffer = null;
        let isPlaying = false;
        let startTime = 0;
        
        let syncedLyrics = [];
        let selectedTrack = null;

        // Ensure font is pre-loaded for canvas rendering
        document.fonts.load("italic 800 85px 'Montserrat'").then(() => drawIdleState());

        function drawIdleState() {
            ctx.fillStyle = '#05070f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#1e293b';
            ctx.font = "italic 800 50px 'Montserrat'";
            ctx.textAlign = 'center';
            ctx.fillText("7CLOUDS LYRIC ENGINE READY", canvas.width/2, canvas.height/2);
        }

        // --- 1. SEARCH SEVERAL SONGS ---
        async function searchMusic() {
            const query = document.getElementById('songQuery').value;
            if(!query) return;
            
            statusTxt.innerText = "Searching songs and lyrics...";
            songResultsContainer.innerHTML = `<div style="font-size:11px; color:#00f0ff; padding:10px; text-align:center;">Searching...</div>`;
            
            try {
                // Fetch multiple tracks from LRCLIB for synced lyrics + iTunes for audio stream
                const [lrcRes, itunesRes] = await Promise.all([
                    fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`),
                    fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=5`)
                ]);

                const lrcData = await lrcRes.json();
                const itunesData = await itunesRes.json();

                if(!itunesData.results || itunesData.results.length === 0) {
                    songResultsContainer.innerHTML = `<div style="font-size:11px; color:#ff0055; padding:10px; text-align:center;">No results found.</div>`;
                    return;
                }

                songResultsContainer.innerHTML = '';

                // Render list of several tracks
                itunesData.results.forEach((track, index) => {
                    const item = document.createElement('div');
                    item.className = `track-item ${index === 0 ? 'active' : ''}`;
                    item.innerHTML = `
                        <div class="track-info">
                            <span class="track-title">${track.trackName}</span>
                            <span class="track-artist">${track.artistName} • ${track.collectionName || 'Single'}</span>
                        </div>
                        <span style="font-size:10px; color:#00f0ff;">SELECT</span>
                    `;
                    item.onclick = () => {
                        document.querySelectorAll('.track-item').forEach(el => el.classList.remove('active'));
                        item.classList.add('active');
                        loadSelectedTrack(track, lrcData);
                    };
                    songResultsContainer.appendChild(item);
                });

                // Auto-load first track result & generate background choices
                generateBackgrounds(query);
                loadSelectedTrack(itunesData.results[0], lrcData);

            } catch(err) {
                statusTxt.innerText = "Search Error: " + err.message;
            }
        }

        // --- 2. GENERATE SEVERAL BACKGROUND OPTIONS ---
        function generateBackgrounds(query) {
            bgGridContainer.innerHTML = '';
            statusTxt.innerText = "Generating 4 AI background options...";

            // 4 distinct artistic aesthetic styles
            const styles = [
                `cinematic atmospheric landscape artwork for ${query} dynamic lighting wallpaper`,
                `neon cyberpunk futuristic dark aesthetic wallpaper for ${query}`,
                `fantasy mystical dramatic clouds surreal art for ${query}`,
                `lofi dark anime aesthetic scenic background for ${query}`
            ];

            styles.forEach((promptText, index) => {
                const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptText)}?width=1920&height=1080&nologo=true&seed=${(index+1)*123}`;
                
                const imgThumb = document.createElement('img');
                imgThumb.className = `bg-thumb ${index === 0 ? 'active' : ''}`;
                imgThumb.src = imgUrl;

                imgThumb.onclick = () => {
                    document.querySelectorAll('.bg-thumb').forEach(el => el.classList.remove('active'));
                    imgThumb.classList.add('active');
                    bgImg.crossOrigin = "anonymous";
                    bgImg.src = imgUrl;
                    statusTxt.innerText = "Background updated!";
                };

                bgGridContainer.appendChild(imgThumb);

                if (index === 0) {
                    bgImg.crossOrigin = "anonymous";
                    bgImg.src = imgUrl;
                }
            });
        }

        // --- 3. LOAD SELECTED TRACK & SYNCHRONIZED LYRICS ---
        async function loadSelectedTrack(track, lrcData) {
            selectedTrack = track;
            playBtn.disabled = true;
            statusTxt.innerText = `Loading track: ${track.trackName}...`;

            // Find matching lyrics from LRCLIB search
            const lyricMatch = lrcData.find(l => l.syncedLyrics && l.trackName.toLowerCase().includes(track.trackName.toLowerCase())) || lrcData.find(l => l.syncedLyrics);

            if (lyricMatch && lyricMatch.syncedLyrics) {
                parseLRC(lyricMatch.syncedLyrics);
            } else {
                syncedLyrics = [];
                statusTxt.innerText = "No synced lyrics available for this track.";
            }

            // Fetch and Decode Audio preview or local MP3
            if (!document.getElementById('fullMp3Input').files.length) {
                const audioRes = await fetch(track.previewUrl);
                const arrayBuffer = await audioRes.arrayBuffer();
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            }

            playBtn.disabled = false;
            statusTxt.innerText = `Ready: ${track.trackName} - ${track.artistName}`;
        }

        // --- 4. OPTIONAL FULL MP3 OVERRIDE ---
        document.getElementById('fullMp3Input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            statusTxt.innerText = "Decoding full local MP3 file...";
            
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await file.arrayBuffer();
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            
            playBtn.disabled = false;
            statusTxt.innerText = "Full MP3 Loaded and Synced!";
        });

        // Parse .lrc synced lyrics
        function parseLRC(lrcString) {
            syncedLyrics = [];
            const lines = lrcString.split('\n');
            const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
            
            for (let line of lines) {
                const match = line.match(regex);
                if (match) {
                    const minutes = parseInt(match[1]);
                    const seconds = parseInt(match[2]);
                    const ms = parseInt(match[3].padEnd(3, '0'));
                    const timeInSeconds = (minutes * 60) + seconds + (ms / 1000);
                    const text = match[4].trim();
                    if (text) syncedLyrics.push({ time: timeInSeconds, text: text });
                }
            }
        }

        function setupAudio() {
            source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.8;
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
        }

        playBtn.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) {
                source.stop();
                isPlaying = false;
                playBtn.innerText = "▶️ PLAY 16:9 LYRIC VIDEO";
            } else {
                setupAudio();
                source.start(0);
                startTime = audioCtx.currentTime;
                isPlaying = true;
                playBtn.innerText = "⏸️ STOP VIDEO";
                renderFrame();
            }
        });

        // Smart text wrapping for 7clouds dynamic placement
        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            let linesArray = [];

            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let testWidth = ctx.measureText(testLine).width;
                if (testWidth > maxWidth && n > 0) {
                    linesArray.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            linesArray.push(line);

            let startY = y - ((linesArray.length - 1) * lineHeight) / 2;

            for(let k = 0; k < linesArray.length; k++) {
                ctx.fillText(linesArray[k], x, startY + (k * lineHeight));
                ctx.strokeText(linesArray[k], x, startY + (k * lineHeight));
            }
        }

        // --- 5. CANVAS RENDER LOOP (1920x1080 LANDSCAPE) ---
        function renderFrame() {
            if (!isPlaying) return;
            requestAnimationFrame(renderFrame);

            const currentTime = audioCtx.currentTime - startTime;
            
            if (currentTime >= audioBuffer.duration) {
                isPlaying = false;
                playBtn.innerText = "▶️ PLAY 16:9 LYRIC VIDEO";
                return;
            }

            // Audio pulse
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            let bass = (dataArray[0] + dataArray[1] + dataArray[2]) / 3;
            let kickPump = bass > 200 ? (bass - 200) / 120 : 0;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const scale = 1 + (kickPump * 0.04);

            // Draw Selected Background
            if (bgImg.complete && bgImg.naturalWidth !== 0) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.scale(scale, scale);
                ctx.drawImage(bgImg, -canvas.width/2, -canvas.height/2, canvas.width, canvas.height);
                ctx.restore();
            }

            // Cinematic Dark Vignette for ultimate text readability
            let grad = ctx.createRadialGradient(cx, cy, 300, cx, cy, 1100);
            grad.addColorStop(0, "rgba(0,0,0,0.35)");
            grad.addColorStop(1, "rgba(0,0,0,0.88)");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Active & Next Lyric Lookup
            let activeLyric = "";
            let nextLyric = "";
            
            for (let i = 0; i < syncedLyrics.length; i++) {
                if (currentTime >= syncedLyrics[i].time) {
                    activeLyric = syncedLyrics[i].text;
                    if (i + 1 < syncedLyrics.length) nextLyric = syncedLyrics[i+1].text;
                } else {
                    break;
                }
            }

            // Draw Upcoming Line (Preview)
            if (nextLyric) {
                ctx.font = "800 36px 'Montserrat'";
                ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
                ctx.textAlign = "center";
                ctx.fillText(nextLyric, cx, cy + 180);
            }

            // Draw Active Lyric (7clouds Typography)
            if (activeLyric) {
                ctx.font = "italic 800 85px 'Montserrat'";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                // Heavy multi-layer shadows for crisp visibility on any background
                ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
                ctx.shadowBlur = 30;
                ctx.shadowOffsetX = 6;
                ctx.shadowOffsetY = 6;

                ctx.fillStyle = "#ffffff";
                ctx.lineWidth = 4;
                ctx.strokeStyle = "rgba(0, 0, 0, 0.6)";

                const maxTextWidth = canvas.width * 0.82;
                wrapText(ctx, activeLyric.toUpperCase(), cx, cy, maxTextWidth, 105);
                
                ctx.shadowBlur = 0;
            }
        }
    </script>
</body>
</html>
