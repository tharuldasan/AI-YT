<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA // V3 AUTOMATED SHORTS ENGINE</title>
    <style>
        :root {
            --bg: #05070f; --card: #0d111d; --primary: #00f0ff;
            --text: #f8fafc; --border: #1e293b;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg); color: var(--text);
            margin: 0; padding: 20px; display: flex; gap: 20px;
            justify-content: center; flex-wrap: wrap;
        }
        .panel {
            background: var(--card); padding: 24px; border-radius: 12px;
            width: 100%; max-width: 420px; border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 4px; color: var(--primary); font-size: 22px; letter-spacing: 2px; text-transform: uppercase; }
        .subtitle { font-size: 11px; color: #64748b; margin-bottom: 20px; letter-spacing: 1px; }
        label { display: block; margin: 12px 0 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; color: #94a3b8; }
        input[type="text"], input[type="color"] {
            width: 100%; padding: 12px; background: #05070f; border: 1px solid var(--border);
            border-radius: 6px; color: #fff; box-sizing: border-box; font-size: 14px;
        }
        input[type="range"] { width: 100%; margin-bottom: 5px; cursor: pointer; }
        .search-group { display: flex; gap: 8px; }
        .search-group button { width: auto; white-space: nowrap; }
        .canvas-container {
            background: #000; border-radius: 12px; overflow: hidden;
            border: 2px solid var(--border); width: 360px; height: 640px; 
            position: relative; box-shadow: 0 0 40px rgba(0, 240, 255, 0.2);
        }
        canvas { width: 100%; height: 100%; display: block; }
        button {
            width: 100%; padding: 14px; margin-top: 12px;
            background: linear-gradient(135deg, var(--primary), #0072ff);
            color: #000; border: none; border-radius: 6px; font-weight: 900;
            letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
            transition: all 0.2s ease;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button.record { background: linear-gradient(135deg, #ff0055, #ff0000); color: white; }
        button:disabled { background: #334155; color: #64748b; cursor: not-allowed; transform: none; }
        .file-inputs { margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border); }
        .value-display { font-size: 12px; color: var(--primary); float: right; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>⚡ AURA ENGINE V3</h1>
        <div class="subtitle">CRISP VIZZY SPECTRUM & KINETIC CAMERA</div>
        
        <label>1. Search Song Online (Auto-Fetches Official BG):</label>
        <div class="search-group">
            <input type="text" id="songQuery" placeholder="e.g. Metamorphosis Phonk">
            <button onclick="searchSong()">Search</button>
        </div>

        <div class="file-inputs">
            <label>Main Theme Color:</label>
            <input type="color" id="themeColor" value="#00f0ff">
            
            <label>Playback Speed (Slowed): <span class="value-display" id="speedVal">1.0x</span></label>
            <input type="range" id="speedSlider" min="0.5" max="1.5" step="0.05" value="1.0">

            <label>Audio Start Offset (Seconds): <span class="value-display" id="offsetVal">0s</span></label>
            <input type="range" id="offsetSlider" min="0" max="180" step="1" value="0">
            
            <label>Inner Logo Picture Size: <span class="value-display" id="logoSizeVal">240px</span></label>
            <input type="range" id="logoSizeSlider" min="100" max="400" step="10" value="240">

            <label>Optional: Custom BG (Overrides Official):</label>
            <input type="file" id="bgInput" accept="image/*">
            
            <label>Optional: Custom Logo (Overrides logo.png):</label>
            <input type="file" id="logoInput" accept="image/*">

            <label>Or Local MP3 File:</label>
            <input type="file" id="audioInput" accept="audio/*">
        </div>

        <button id="playBtn" disabled>▶️ PLAY & PREVIEW</button>
        <button id="recordBtn" class="record" disabled>🔴 RECORD SHORTS VIDEO (.WEBM)</button>
        <div id="status" style="font-size: 11px; color: #00f0ff; margin-top: 10px; text-align: center;"></div>
    </div>

    <div class="canvas-container">
        <!-- Render resolution strictly set to 1080x1920 vertical -->
        <canvas id="visualizer" width="1080" height="1920"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        // Assets & State
        let bgImg = new Image();
        let logoImg = new Image();
        logoImg.src = 'logo.png'; 
        
        let particles = [];
        let themeColor = "#00f0ff";
        let innerLogoSize = 240;
        let startOffset = 0;

        // Web Audio
        let audioCtx, source, analyser, gainNode, mediaDest;
        let audioBuffer = null;
        let isPlaying = false;
        let startTime = 0;

        // Recording
        let mediaRecorder;
        let recordedChunks = [];

        // UI Elements
        const statusTxt = document.getElementById('status');
        const playBtn = document.getElementById('playBtn');
        const recordBtn = document.getElementById('recordBtn');
        const speedSlider = document.getElementById('speedSlider');
        const logoSizeSlider = document.getElementById('logoSizeSlider');
        const offsetSlider = document.getElementById('offsetSlider');

        // Init Particles 
        for(let i = 0; i < 60; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 6 + 2, 
                speedY: Math.random() * -4 - 2,
                speedX: Math.random() * 2 - 1,
                opacity: Math.random()
            });
        }

        // Event Listeners for UI
        document.getElementById('themeColor').addEventListener('input', (e) => {
            themeColor = e.target.value;
            document.documentElement.style.setProperty('--primary', themeColor);
        });
        
        speedSlider.addEventListener('input', (e) => {
            document.getElementById('speedVal').innerText = e.target.value + 'x';
            if (source) source.playbackRate.value = e.target.value;
        });

        offsetSlider.addEventListener('input', (e) => {
            startOffset = parseInt(e.target.value);
            document.getElementById('offsetVal').innerText = startOffset + 's';
        });

        logoSizeSlider.addEventListener('input', (e) => {
            innerLogoSize = parseInt(e.target.value);
            document.getElementById('logoSizeVal').innerText = innerLogoSize + 'px';
        });

        document.getElementById('bgInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) bgImg.src = URL.createObjectURL(file);
        });
        document.getElementById('logoInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) logoImg.src = URL.createObjectURL(file);
        });

        // Online Song Search
        async function searchSong() {
            const query = document.getElementById('songQuery').value;
            if(!query) return;
            statusTxt.innerText = "Searching online audio...";

            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=1`);
                const data = await res.json();
                if(data.results.length === 0) return statusTxt.innerText = "No track found.";

                const track = data.results[0];
                statusTxt.innerText = `Loaded: ${track.trackName} - ${track.artistName}`;
                
                if(!document.getElementById('bgInput').files.length) {
                    bgImg.src = track.artworkUrl100.replace('100x100bb', '1000x1000bb');
                }

                const audioRes = await fetch(track.previewUrl);
                const arrayBuffer = await audioRes.arrayBuffer();
                
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                playBtn.disabled = false;
            } catch(err) {
                statusTxt.innerText = "Error: " + err.message;
            }
        }

        // Local Audio Loader
        document.getElementById('audioInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            statusTxt.innerText = "Decoding local audio file...";
            
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await file.arrayBuffer();
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            
            playBtn.disabled = false;
            statusTxt.innerText = "Local file loaded!";
        });

        function setupAudio() {
            source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.playbackRate.value = speedSlider.value;

            gainNode = audioCtx.createGain(); 
            gainNode.gain.value = 0; 

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256; 
            analyser.smoothingTimeConstant = 0.8; 

            mediaDest = audioCtx.createMediaStreamDestination();

            source.connect(gainNode);
            gainNode.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.connect(mediaDest);
        }

        playBtn.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) {
                source.stop();
                isPlaying = false;
                playBtn.innerText = "▶️ PLAY & PREVIEW";
                recordBtn.disabled = true;
            } else {
                setupAudio();
                // Apply the start offset here
                source.start(0, startOffset);
                startTime = audioCtx.currentTime;
                isPlaying = true;
                playBtn.innerText = "⏸️ STOP AUDIO";
                recordBtn.disabled = false;
                renderFrame();
            }
        });

        function renderFrame() {
            if (!isPlaying) return;
            requestAnimationFrame(renderFrame);

            let elapsed = audioCtx.currentTime - startTime;
            let currentSpeed = parseFloat(speedSlider.value);
            let actualDuration = (audioBuffer.duration - startOffset) / currentSpeed;
            
            let fadeAlpha = 1;
            if (elapsed < 1.5) fadeAlpha = elapsed / 1.5; 
            else if (actualDuration - elapsed < 1.5) fadeAlpha = Math.max(0, (actualDuration - elapsed) / 1.5); 
            
            if (gainNode) gainNode.gain.value = fadeAlpha;
            
            if (elapsed >= actualDuration) {
                isPlaying = false;
                playBtn.innerText = "▶️ PLAY & PREVIEW";
                if(mediaRecorder && mediaRecorder.state === 'recording') recordBtn.click();
                return;
            }

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            let bassSum = 0;
            for(let i = 0; i < 5; i++) bassSum += dataArray[i];
            let bassIntensity = bassSum / 5; 
            // Aggressive kick threshold for the "Superlative Boom"
            let kick = bassIntensity > 210 ? (bassIntensity - 210) / 45 : 0; 

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = fadeAlpha;

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // 1. Camera Shake AND Rotation (Translational + Rotational Kinetic effect)
            ctx.save();
            let shakeX = (Math.random() - 0.5) * kick * 40;
            let shakeY = (Math.random() - 0.5) * kick * 40;
            let rotationAngle = (Math.random() - 0.5) * kick * 0.04; // Slight tilt
            
            ctx.translate(cx + shakeX, cy + shakeY);
            ctx.rotate(rotationAngle);
            ctx.translate(-cx, -cy);

            // 2. Background Drawing
            if (bgImg.src && bgImg.complete) {
                // Scale up slightly to hide edges during heavy camera shake/rotation
                let scale = Math.max(canvas.width / bgImg.width, canvas.height / bgImg.height) * 1.1;
                let x = (canvas.width / 2) - (bgImg.width / 2) * scale;
                let y = (canvas.height / 2) - (bgImg.height / 2) * scale;
                ctx.drawImage(bgImg, x, y, bgImg.width * scale, bgImg.height * scale);
            } else {
                ctx.fillStyle = "#05070f";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 3. Dynamic Color Tint Overlay (Pulses with bass)
            ctx.fillStyle = themeColor;
            ctx.globalCompositeOperation = "overlay";
            ctx.globalAlpha = 0.4 + (kick * 0.4);
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = "source-over";
            ctx.globalAlpha = fadeAlpha;

            // 4. Particles Engine
            ctx.fillStyle = themeColor;
            for(let p of particles) {
                p.y += p.speedY - (kick * 6);
                p.x += p.speedX;
                if(p.y < 0) p.y = canvas.height + p.size;
                if(p.x < 0 || p.x > canvas.width) p.x = Math.random() * canvas.width;

                ctx.globalAlpha = p.opacity * fadeAlpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size + (kick * 2), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = fadeAlpha;

            // 5. Crisp Vizzy Style Spectrum
            const spectrumBaseRadius = 250; // Locked size for the spectrum ring
            const numBars = 64; // Number of discrete lines

            // Draw center black circle backing
            ctx.beginPath();
            ctx.arc(cx, cy, spectrumBaseRadius - 2, 0, Math.PI * 2);
            ctx.fillStyle = "#000000";
            ctx.fill();

            // Draw crisp glowing bars facing outward
            for (let i = 0; i < numBars; i++) {
                // Mirror the data so left and right sides are symmetrical
                let dataIndex = i < (numBars / 2) ? i : (numBars - i - 1);
                // Boost the visual height significantly for the boom effect
                let barHeight = (dataArray[dataIndex] / 255) * 180 * (1 + kick * 0.5); 
                
                let angle = (i * (Math.PI * 2)) / numBars;
                let x1 = cx + Math.cos(angle) * spectrumBaseRadius;
                let y1 = cy + Math.sin(angle) * spectrumBaseRadius;
                let x2 = cx + Math.cos(angle) * (spectrumBaseRadius + barHeight);
                let y2 = cy + Math.sin(angle) * (spectrumBaseRadius + barHeight);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                
                ctx.strokeStyle = themeColor;
                ctx.lineWidth = 6;
                ctx.lineCap = "round";
                
                // Add Glow to the strokes
                ctx.shadowBlur = 15 + (kick * 20);
                ctx.shadowColor = themeColor;
                ctx.stroke();
            }
            ctx.shadowBlur = 0; // reset glow

            // 6. Draw Independent Inner Logo
            if (logoImg.src && logoImg.complete && logoImg.naturalWidth !== 0) {
                // Size controlled exclusively by the slider, plus a tiny bass pump
                let currentLogoSize = innerLogoSize + (kick * 15); 
                
                ctx.save();
                ctx.beginPath();
                // Ensure the image never bleeds outside the black base circle
                ctx.arc(cx, cy, spectrumBaseRadius - 5, 0, Math.PI * 2); 
                ctx.clip();
                ctx.drawImage(logoImg, cx - currentLogoSize/2, cy - currentLogoSize/2, currentLogoSize, currentLogoSize);
                ctx.restore();
            }

            ctx.restore(); // Restore camera shake/rotation matrix
        }

        // Recording Functionality
        recordBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                recordBtn.innerText = "🔴 RECORD SHORTS VIDEO (.WEBM)";
                statusTxt.innerText = "Encoding video file...";
                return;
            }

            const canvasStream = canvas.captureStream(30);
            const combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(), 
                ...mediaDest.stream.getAudioTracks()
            ]);

            mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
            recordedChunks = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `AURA_SHORTS_${Date.now()}.webm`;
                a.click();
                URL.revokeObjectURL(url);
                statusTxt.innerText = "Aura Shorts Video Exported!";
            };

            mediaRecorder.start();
            recordBtn.innerText = "⏹️ STOP & SAVE SHORTS VIDEO";
            statusTxt.innerText = "Recording video in high-quality 1080x1920...";
        });
    </script>
</body>
</html>
