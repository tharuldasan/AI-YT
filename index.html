<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA // Studio Audio Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070f;
            --card: #0d111d;
            --primary: #ff0055;
            --accent: #00f0ff;
            --text: #f8fafc;
            --border: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        
        .panel {
            background: var(--card);
            padding: 20px;
            border-radius: 14px;
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--border);
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        h1 { color: var(--primary); font-size: 18px; letter-spacing: 1.5px; text-transform: uppercase; }
        .subtitle { font-size: 11px; color: #64748b; letter-spacing: 1px; margin-top: -8px; }
        
        .section-box {
            background: #05070f;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .section-title { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }

        label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #94a3b8; }
        
        input[type="text"], input[type="file"], input[type="range"], select {
            width: 100%; padding: 8px; background: #0b0f19; border: 1px solid var(--border);
            border-radius: 6px; color: #fff; font-size: 12px; outline: none;
        }

        .row { display: flex; gap: 8px; }
        
        button {
            padding: 8px 14px; background: linear-gradient(135deg, var(--primary), #ff7b00);
            color: #fff; border: none; border-radius: 6px; font-weight: 800;
            cursor: pointer; text-transform: uppercase; transition: all 0.2s ease; font-size: 11px;
        }
        button:hover { opacity: 0.9; }

        /* Mode Selector */
        .mode-selector {
            display: flex; gap: 8px; background: #05070f; padding: 4px; border-radius: 8px; border: 1px solid var(--border);
        }
        .mode-btn {
            flex: 1; background: transparent; color: #64748b; padding: 8px; border-radius: 6px; font-size: 11px; text-align: center; cursor: pointer; font-weight: 700;
        }
        .mode-btn.active { background: var(--primary); color: #fff; }

        /* Player Canvas View */
        .player-wrapper { display: flex; flex-direction: column; gap: 8px; }
        .canvas-container {
            background: #000; border-radius: 14px; overflow: hidden;
            border: 2px solid var(--border);
            width: 854px; height: 480px; /* 16:9 Aspect Ratio */
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.1);
            position: relative;
        }
        canvas { width: 100%; height: 100%; display: block; }

        /* YouTube Scrubber Timeline */
        .yt-scrubber-container {
            width: 854px; background: var(--card); padding: 12px 16px; border-radius: 10px;
            border: 1px solid var(--border); display: flex; align-items: center; gap: 12px;
        }
        .time-display { font-size: 12px; font-family: monospace; color: var(--accent); min-width: 95px; }
        input[type="range"].scrubber {
            flex: 1; -webkit-appearance: none; appearance: none; height: 6px; padding: 0;
            background: #1e293b; border-radius: 3px; cursor: pointer;
        }
        input[type="range"].scrubber::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
            border-radius: 50%; background: var(--primary); cursor: pointer; transition: transform 0.1s;
        }
        input[type="range"].scrubber::-webkit-slider-thumb:hover { transform: scale(1.3); }

        #status { font-size: 11px; color: var(--accent); text-align: center; min-height: 16px; font-weight: 600; }
    </style>
</head>
<body>

    <!-- CONTROL PANEL -->
    <div class="panel">
        <h1>⚡ AURA STUDIO</h1>
        <div class="subtitle">FULL SONG • SEPARATE CONTROLS • BASS REACTIVE</div>
        
        <!-- Display Mode Switcher -->
        <label>Visual Display Mode:</label>
        <div class="mode-selector">
            <div class="mode-btn active" id="btnModeLyrics" onclick="setVisualMode('lyrics')">🎤 Lyrics Mode</div>
            <div class="mode-btn" id="btnModeLines" onclick="setVisualMode('lines')">🎵 Audio Spectrum Lines</div>
        </div>

        <!-- 1. SONG SELECTION SECTION -->
        <div class="section-box">
            <div class="section-title">1. Select Song (Full Songs)</div>
            
            <label>Upload Full MP3 File (Unlimited Length):</label>
            <input type="file" id="songFileInput" accept="audio/*">

            <label>Or Full Song Presets (3+ Mins):</label>
            <select id="songPresetSelect">
                <option value="">-- Choose Full Song Preset --</option>
                <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">Preset 1: Electro Synth Wave (6:12)</option>
                <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">Preset 2: Chill EDM Beat (5:44)</option>
                <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3">Preset 3: Upbeat Dance Track (7:05)</option>
            </select>

            <label>Or Online Preview Search (30s max API preview):</label>
            <div class="row">
                <input type="text" id="songQueryInput" placeholder="e.g. Limitless Elektronomia">
                <button onclick="searchOnlineTrack()">Search</button>
            </div>
        </div>

        <!-- 2. BACKGROUND SELECTION SECTION -->
        <div class="section-box">
            <div class="section-title">2. Select Background Image (Independent)</div>
            
            <label>Upload Background Picture:</label>
            <input type="file" id="bgFileInput" accept="image/*">

            <label>Or Choose Wallpaper Presets:</label>
            <select id="bgPresetSelect" onchange="loadBgPreset(this.value)">
                <option value="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=1600">Preset 1: Studio Lights</option>
                <option value="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=1600">Preset 2: DJ Concertstage</option>
                <option value="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=1600">Preset 3: Neon Abstract</option>
                <option value="https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=1600">Preset 4: Dark Space Grid</option>
            </select>
        </div>

        <!-- 3. AUDIO LINES CONTROLS -->
        <div class="section-box">
            <div class="section-title">3. Line Bounce & Density Controls</div>
            
            <label>Line Height / Amplitude (Bass Bounce):</label>
            <input type="range" id="ampSlider" min="0.5" max="4.0" step="0.1" value="2.0">

            <label>Line Density (Number of Spectrum Bars):</label>
            <input type="range" id="densitySlider" min="32" max="128" step="16" value="64">

            <label>Color Style:</label>
            <select id="genreColorSelect">
                <option value="ncs" selected>NCS (Cyan & Yellow Wave)</option>
                <option value="edm">EDM (Pink & Neon Cyan)</option>
                <option value="phonk">Phonk (Deep Red & Violet)</option>
                <option value="funk">Funk (Gold & Teal)</option>
            </select>
        </div>

        <div id="status">Ready</div>
        <button id="playBtn">▶️ PLAY VIDEO</button>
    </div>

    <!-- PLAYER CANVAS & TIMELINE -->
    <div class="player-wrapper">
        <div class="canvas-container">
            <canvas id="visualizer" width="1920" height="1080"></canvas>
        </div>

        <div class="yt-scrubber-container">
            <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
            <input type="range" class="scrubber" id="seekBar" value="0" min="0" max="100" step="0.1">
        </div>
    </div>

    <!-- Hidden HTML5 Audio Element -->
    <audio id="audioElement" crossorigin="anonymous"></audio>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const audioElem = document.getElementById('audioElement');
        const statusTxt = document.getElementById('status');
        const playBtn = document.getElementById('playBtn');
        const seekBar = document.getElementById('seekBar');
        const timeDisplay = document.getElementById('timeDisplay');
        
        const ampSlider = document.getElementById('ampSlider');
        const densitySlider = document.getElementById('densitySlider');
        const genreColorSelect = document.getElementById('genreColorSelect');

        let audioCtx, source, analyser;
        let isPlaying = false;
        let visualMode = 'lyrics';
        
        let bgImg = new Image();
        // Load default dark background
        bgImg.crossOrigin = "anonymous";
        bgImg.src = "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=1600";

        let syncedLyrics = [];
        let songTitle = "Limitless";
        let artistName = "Elektronomia";

        function setVisualMode(mode) {
            visualMode = mode;
            document.getElementById('btnModeLyrics').classList.toggle('active', mode === 'lyrics');
            document.getElementById('btnModeLines').classList.toggle('active', mode === 'lines');
        }

        // --- 1. SONG SELECTION HANDLERS ---
        
        // A. Local Full MP3 Upload
        document.getElementById('songFileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            audioElem.src = URL.createObjectURL(file);
            songTitle = file.name.replace(/\.[^/.]+$/, "");
            artistName = "Local Song File";
            initAudio();
            statusTxt.innerText = "Full Local MP3 Loaded! Ready to play.";
        });

        // B. Full Song Presets
        document.getElementById('songPresetSelect').addEventListener('change', (e) => {
            if (!e.target.value) return;
            audioElem.src = e.target.value;
            songTitle = e.target.options[e.target.selectedIndex].text.split(':')[1] || "Preset Song";
            artistName = "Full Length Audio";
            initAudio();
            statusTxt.innerText = "Full Song Preset Loaded!";
        });

        // C. Online Track Search
        async function searchOnlineTrack() {
            const query = document.getElementById('songQueryInput').value;
            if(!query) return;

            statusTxt.innerText = "Searching track & lyrics...";
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=1`);
                const data = await res.json();

                if (data.results.length > 0) {
                    const track = data.results[0];
                    audioElem.src = track.previewUrl;
                    songTitle = track.trackName;
                    artistName = track.artistName;
                    initAudio();
                    statusTxt.innerText = "Online Track Loaded (30s preview).";
                }

                // Fetch lyrics
                const lrcRes = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`);
                const lrcData = await lrcRes.json();
                if (lrcData.length > 0 && lrcData[0].syncedLyrics) {
                    parseLRC(lrcData[0].syncedLyrics);
                }
            } catch(err) {
                statusTxt.innerText = "Search failed: " + err.message;
            }
        }

        // --- 2. INDEPENDENT BACKGROUND HANDLERS ---
        document.getElementById('bgFileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                bgImg = new Image();
                bgImg.src = evt.target.result;
                statusTxt.innerText = "Custom Background Loaded!";
            };
            reader.readAsDataURL(file);
        });

        function loadBgPreset(url) {
            bgImg = new Image();
            bgImg.crossOrigin = "anonymous";
            bgImg.src = url;
            statusTxt.innerText = "Background Preset Changed!";
        }

        function parseLRC(lrcString) {
            syncedLyrics = [];
            const lines = lrcString.split('\n');
            const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
            for (let line of lines) {
                const match = line.match(regex);
                if (match) {
                    const time = (parseInt(match[1]) * 60) + parseInt(match[2]) + (parseInt(match[3].padEnd(3, '0')) / 1000);
                    const text = match[4].trim();
                    if (text) syncedLyrics.push({ time, text });
                }
            }
        }

        // --- 3. WEB AUDIO ENGINE ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                source = audioCtx.createMediaElementSource(audioElem);
                analyser = audioCtx.createAnalyser();
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
            }
            analyser.fftSize = 256;
        }

        playBtn.addEventListener('click', () => {
            if (!audioElem.src) {
                statusTxt.innerText = "Please select a song first!";
                return;
            }
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) {
                audioElem.pause();
                isPlaying = false;
                playBtn.innerText = "▶️ PLAY VIDEO";
            } else {
                audioElem.play();
                isPlaying = true;
                playBtn.innerText = "⏸️ PAUSE VIDEO";
                renderFrame();
            }
        });

        // Scrubber Updates
        audioElem.addEventListener('timeupdate', () => {
            if(!audioElem.duration) return;
            seekBar.value = (audioElem.currentTime / audioElem.duration) * 100;
            timeDisplay.innerText = `${formatTime(audioElem.currentTime)} / ${formatTime(audioElem.duration)}`;
        });
        seekBar.addEventListener('input', () => {
            if(audioElem.duration) audioElem.currentTime = (seekBar.value / 100) * audioElem.duration;
        });
        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // --- 4. REAL-TIME BASS-REACTIVE CANVAS RENDERER ---
        function renderFrame() {
            if (!isPlaying) return;
            requestAnimationFrame(renderFrame);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const currentTime = audioElem.currentTime;

            // Clear Frame Cleanly
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Fetch Frequency Data
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            // Calculate Bass Kick Intensity (Lowest 8 Frequencies)
            let bassSum = 0;
            for(let b = 0; b < 8; b++) bassSum += dataArray[b];
            let bassRatio = (bassSum / 8) / 255; // 0.0 to 1.0

            // Draw Background Image (with slight bass scale zoom)
            if (bgImg.complete && bgImg.naturalWidth !== 0) {
                ctx.save();
                ctx.translate(cx, cy);
                let scale = 1 + (bassRatio * 0.04);
                ctx.scale(scale, scale);
                ctx.drawImage(bgImg, -canvas.width/2, -canvas.height/2, canvas.width, canvas.height);
                ctx.restore();
            } else {
                ctx.fillStyle = '#05070f';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Dark Vignette Overlay
            let grad = ctx.createRadialGradient(cx, cy, 250, cx, cy, 1200);
            grad.addColorStop(0, "rgba(0,0,0,0.4)");
            grad.addColorStop(1, "rgba(0,0,0,0.92)");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // MODE 1: LYRICS MODE
            if (visualMode === 'lyrics') {
                let activeLyric = "";
                for (let i = 0; i < syncedLyrics.length; i++) {
                    if (currentTime >= syncedLyrics[i].time) activeLyric = syncedLyrics[i].text;
                    else break;
                }

                if (activeLyric) {
                    ctx.font = "italic 800 80px 'Montserrat'";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
                    ctx.shadowBlur = 25;
                    ctx.fillStyle = "#ffffff";
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = "rgba(0, 0, 0, 0.6)";
                    ctx.fillText(activeLyric.toUpperCase(), cx, cy);
                    ctx.strokeText(activeLyric.toUpperCase(), cx, cy);
                    ctx.shadowBlur = 0;
                }
            } 
            // MODE 2: AUDIO SPECTRUM LINES MODE (NCS/Velorix Style)
            else if (visualMode === 'lines') {
                
                // 1. Central Pulsing Bass Orb (Glowing behind lines)
                ctx.save();
                ctx.beginPath();
                let orbRadius = 70 + (bassRatio * 90); // Expands heavily on kick/bass
                let orbGrad = ctx.createRadialGradient(cx, cy, 5, cx, cy, orbRadius);
                orbGrad.addColorStop(0, "rgba(255, 255, 200, " + (0.7 + bassRatio*0.3) + ")");
                orbGrad.addColorStop(0.4, "rgba(255, 180, 0, " + (0.4 + bassRatio*0.3) + ")");
                orbGrad.addColorStop(1, "rgba(255, 0, 85, 0)");
                ctx.fillStyle = orbGrad;
                ctx.arc(cx, cy, orbRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 2. Central Horizontal Baseline
                ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(cx - 500, cy);
                ctx.lineTo(cx + 500, cy);
                ctx.stroke();

                // 3. Audio Lines (Dynamic Bass, Mid, Treble Bounces)
                const numBars = parseInt(densitySlider.value);
                const barWidth = 8;
                const spacing = 6;
                const totalWidth = numBars * (barWidth + spacing);
                const startX = cx - (totalWidth / 2);
                const ampMultiplier = parseFloat(ampSlider.value);
                const colorTheme = genreColorSelect.value;

                for (let i = 0; i < numBars; i++) {
                    // Logarithmic index sampling so bass, mids, highs react independently
                    let binIndex = Math.floor(Math.pow(i / numBars, 2) * (bufferLength * 0.8));
                    let rawVal = dataArray[binIndex] || 0;

                    // Boost low bass frequencies on left/center
                    let freqWeight = (i < numBars * 0.3) ? 1.4 : 1.0;
                    let barHeight = (rawVal / 255) * (canvas.height * 0.35) * ampMultiplier * freqWeight;

                    let x = startX + i * (barWidth + spacing);

                    // Dynamic Color Themes
                    let ratio = i / numBars;
                    if (colorTheme === 'edm') ctx.fillStyle = `hsl(${180 + ratio * 120}, 100%, 65%)`;
                    else if (colorTheme === 'phonk') ctx.fillStyle = `hsl(${280 + ratio * 80}, 90%, 55%)`;
                    else if (colorTheme === 'funk') ctx.fillStyle = `hsl(${30 + ratio * 140}, 100%, 60%)`;
                    else ctx.fillStyle = `hsl(${180 + ratio * 40}, 100%, 70%)`; // NCS

                    ctx.shadowColor = ctx.fillStyle;
                    ctx.shadowBlur = 10;

                    // Dual direction vertical spectrum lines radiating from baseline
                    ctx.fillRect(x, cy - (barHeight / 2), barWidth, barHeight);
                }
                ctx.shadowBlur = 0;

                // 4. Track Titles Below Lines
                ctx.font = "700 46px 'Montserrat'";
                ctx.fillStyle = "#ffffff";
                ctx.textAlign = "center";
                ctx.fillText(songTitle, cx, cy + 180);

                ctx.font = "600 26px 'Montserrat'";
                ctx.fillStyle = "rgba(255,255,255,0.65)";
                ctx.fillText(artistName, cx, cy + 225);
            }
        }
    </script>
</body>
</html>
