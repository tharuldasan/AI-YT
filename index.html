<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA // FULL SONG LYRIC & AUDIO LINE ENGINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070f;
            --card: #0d111d;
            --primary: #ff0055;
            --accent: #00f0ff;
            --text: #f8fafc;
            --border: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        
        .panel {
            background: var(--card);
            padding: 20px;
            border-radius: 14px;
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--border);
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        h1 { color: var(--primary); font-size: 18px; letter-spacing: 1.5px; text-transform: uppercase; }
        .subtitle { font-size: 11px; color: #64748b; letter-spacing: 1px; margin-top: -8px; }
        
        label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; display: block; margin-bottom: 4px; }
        
        input[type="text"], input[type="file"], select {
            width: 100%; padding: 10px; background: #05070f; border: 1px solid var(--border);
            border-radius: 8px; color: #fff; font-size: 12px;
        }
        
        .search-group { display: flex; gap: 8px; }
        
        button {
            padding: 10px 16px; background: linear-gradient(135deg, var(--primary), #ff7b00);
            color: #fff; border: none; border-radius: 8px; font-weight: 800;
            cursor: pointer; text-transform: uppercase; transition: all 0.2s ease;
            font-size: 11px;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        
        .mode-selector {
            display: flex; gap: 8px; background: #05070f; padding: 4px; border-radius: 8px; border: 1px solid var(--border);
        }
        .mode-btn {
            flex: 1; background: transparent; color: #64748b; padding: 8px; border-radius: 6px; font-size: 11px; text-align: center; cursor: pointer; font-weight: 700;
        }
        .mode-btn.active { background: var(--primary); color: #fff; }

        .bg-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .bg-thumb {
            width: 100%; aspect-ratio: 16/9; border-radius: 4px; object-fit: cover;
            cursor: pointer; border: 2px solid transparent; transition: all 0.2s; background: #05070f;
        }
        .bg-thumb:hover, .bg-thumb.active { border-color: var(--accent); }

        .player-wrapper {
            display: flex; flex-direction: column; gap: 8px;
        }
        .canvas-container {
            background: #000; border-radius: 14px; overflow: hidden;
            border: 2px solid var(--border);
            width: 854px; height: 480px; /* 16:9 Scale */
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.15);
            position: relative;
        }
        canvas { width: 100%; height: 100%; display: block; }

        /* YouTube Style Timeline / Scrubber Line */
        .yt-scrubber-container {
            width: 854px; background: var(--card); padding: 12px 16px; border-radius: 10px;
            border: 1px solid var(--border); display: flex; align-items: center; gap: 12px;
        }
        .time-display { font-size: 12px; font-family: monospace; color: var(--accent); min-width: 90px; }
        input[type="range"] {
            flex: 1; -webkit-appearance: none; appearance: none; height: 6px;
            background: #1e293b; border-radius: 3px; outline: none; cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
            border-radius: 50%; background: var(--primary); cursor: pointer; transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); }

        #status { font-size: 11px; color: var(--accent); text-align: center; min-height: 18px; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>⚡ AURA ENGINE</h1>
        <div class="subtitle">FULL SONG • LYRICS vs AUDIO LINES • YT SCRUBBER</div>
        
        <!-- Mode Switcher -->
        <label>Visual Mode:</label>
        <div class="mode-selector">
            <div class="mode-btn active" id="btnModeLyrics" onclick="setVisualMode('lyrics')">🎤 7Clouds Lyrics</div>
            <div class="mode-btn" id="btnModeLines" onclick="setVisualMode('lines')">🎵 Audio Spectrum Lines</div>
        </div>

        <!-- Full Song Upload / API Search -->
        <div>
            <label>1. Full Song MP3 File (Recommended for 100% Full Song):</label>
            <input type="file" id="fullMp3Input" accept="audio/*">
        </div>

        <div>
            <label>2. Search Online Lyrics / Preview Track:</label>
            <div class="search-group">
                <input type="text" id="songQuery" placeholder="e.g. Limitless Elektronomia">
                <button onclick="searchMusic()">Search</button>
            </div>
        </div>

        <!-- Custom BG Upload -->
        <div>
            <label>3. Upload Custom Background Image (Or Pick Below):</label>
            <input type="file" id="customBgInput" accept="image/*">
        </div>

        <!-- Background Options -->
        <div>
            <label>AI Generated Backgrounds:</label>
            <div class="bg-grid" id="bgGrid">
                <div style="grid-column: span 4; font-size:10px; color:#64748b; text-align:center; padding:6px;">Search song to load AI backgrounds...</div>
            </div>
        </div>

        <div id="status">Ready</div>

        <button id="playBtn" disabled>▶️ PLAY VIDEO</button>
    </div>

    <!-- Video Canvas + YT Timeline Player -->
    <div class="player-wrapper">
        <div class="canvas-container">
            <canvas id="visualizer" width="1920" height="1080"></canvas>
        </div>

        <!-- YouTube Style Progress Scrubber Line -->
        <div class="yt-scrubber-container">
            <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
            <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1">
        </div>
    </div>

    <!-- Hidden HTML5 Audio Element for Smooth Native Seeking -->
    <audio id="audioElement" crossorigin="anonymous"></audio>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const statusTxt = document.getElementById('status');
        const playBtn = document.getElementById('playBtn');
        const audioElem = document.getElementById('audioElement');
        const seekBar = document.getElementById('seekBar');
        const timeDisplay = document.getElementById('timeDisplay');
        const bgGridContainer = document.getElementById('bgGrid');

        let audioCtx, source, analyser;
        let isPlaying = false;
        let visualMode = 'lyrics'; // 'lyrics' or 'lines'
        
        let bgImg = new Image();
        let syncedLyrics = [];
        let songTitle = "Limitless";
        let artistName = "Elektronomia";

        // Particle System for Audio Lines Mode
        let particles = [];
        for(let i = 0; i < 60; i++) {
            particles.push({
                angle: (Math.PI * 2 / 60) * i,
                radius: 220 + Math.random() * 40,
                size: Math.random() * 6 + 2,
                speed: 0.005 + Math.random() * 0.01
            });
        }

        document.fonts.load("italic 800 85px 'Montserrat'").then(() => drawIdleState());

        function drawIdleState() {
            ctx.fillStyle = '#05070f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#1e293b';
            ctx.font = "italic 800 50px 'Montserrat'";
            ctx.textAlign = 'center';
            ctx.fillText("READY TO PLAY", canvas.width/2, canvas.height/2);
        }

        function setVisualMode(mode) {
            visualMode = mode;
            document.getElementById('btnModeLyrics').classList.toggle('active', mode === 'lyrics');
            document.getElementById('btnModeLines').classList.toggle('active', mode === 'lines');
        }

        // --- 1. FULL MP3 FILE UPLOAD ---
        document.getElementById('fullMp3Input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;

            const url = URL.createObjectURL(file);
            audioElem.src = url;
            songTitle = file.name.replace(/\.[^/.]+$/, "");
            artistName = "Local Audio File";
            
            initAudioContext();
            playBtn.disabled = false;
            statusTxt.innerText = "Full MP3 Loaded! Ready to Play.";
        });

        // --- 2. CUSTOM BACKGROUND IMAGE UPLOAD ---
        document.getElementById('customBgInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                bgImg.src = evt.target.result;
                document.querySelectorAll('.bg-thumb').forEach(el => el.classList.remove('active'));
                statusTxt.innerText = "Custom Background Loaded!";
            };
            reader.readAsDataURL(file);
        });

        // --- 3. ONLINE SEARCH (Lyrics + iTunes Preview) ---
        async function searchMusic() {
            const query = document.getElementById('songQuery').value;
            if(!query) return;

            statusTxt.innerText = "Searching songs and synced lyrics...";
            try {
                const [lrcRes, itunesRes] = await Promise.all([
                    fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`),
                    fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=1`)
                ]);

                const lrcData = await lrcRes.json();
                const itunesData = await itunesRes.json();

                if(itunesData.results.length > 0) {
                    const track = itunesData.results[0];
                    songTitle = track.trackName;
                    artistName = track.artistName;

                    // If no full MP3 is uploaded, use online preview URL
                    if(!document.getElementById('fullMp3Input').files.length) {
                        audioElem.src = track.previewUrl;
                        initAudioContext();
                        playBtn.disabled = false;
                    }
                }

                if(lrcData.length > 0 && lrcData[0].syncedLyrics) {
                    parseLRC(lrcData[0].syncedLyrics);
                    statusTxt.innerText = "Lyrics synced successfully!";
                } else {
                    statusTxt.innerText = "Track loaded (No synced lyrics found).";
                }

                generateBackgrounds(query);

            } catch(err) {
                statusTxt.innerText = "Search Error: " + err.message;
            }
        }

        function generateBackgrounds(query) {
            bgGridContainer.innerHTML = '';
            const styles = [
                `cinematic landscape background for ${query} wallpaper`,
                `neon cyberpunk aesthetic wallpaper for ${query}`,
                `surreal fantasy dark background for ${query}`,
                `minimalist abstract dark wallpaper for ${query}`
            ];

            styles.forEach((promptText, index) => {
                const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptText)}?width=1920&height=1080&nologo=true&seed=${(index+1)*88}`;
                const imgThumb = document.createElement('img');
                imgThumb.className = `bg-thumb ${index === 0 ? 'active' : ''}`;
                imgThumb.src = imgUrl;

                imgThumb.onclick = () => {
                    document.querySelectorAll('.bg-thumb').forEach(el => el.classList.remove('active'));
                    imgThumb.classList.add('active');
                    bgImg.crossOrigin = "anonymous";
                    bgImg.src = imgUrl;
                };

                bgGridContainer.appendChild(imgThumb);
                if(index === 0) {
                    bgImg.crossOrigin = "anonymous";
                    bgImg.src = imgUrl;
                }
            });
        }

        function parseLRC(lrcString) {
            syncedLyrics = [];
            const lines = lrcString.split('\n');
            const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
            
            for (let line of lines) {
                const match = line.match(regex);
                if (match) {
                    const mins = parseInt(match[1]);
                    const secs = parseInt(match[2]);
                    const ms = parseInt(match[3].padEnd(3, '0'));
                    const time = (mins * 60) + secs + (ms / 1000);
                    const text = match[4].trim();
                    if (text) syncedLyrics.push({ time, text });
                }
            }
        }

        // --- 4. WEB AUDIO API & SCRUBBER CONTROL ---
        function initAudioContext() {
            if(!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                source = audioCtx.createMediaElementSource(audioElem);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
            }
        }

        playBtn.addEventListener('click', () => {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) {
                audioElem.pause();
                isPlaying = false;
                playBtn.innerText = "▶️ PLAY VIDEO";
            } else {
                audioElem.play();
                isPlaying = true;
                playBtn.innerText = "⏸️ PAUSE VIDEO";
                renderFrame();
            }
        });

        // YouTube Scrubber Bar Events
        audioElem.addEventListener('timeupdate', () => {
            if(!audioElem.duration) return;
            const progress = (audioElem.currentTime / audioElem.duration) * 100;
            seekBar.value = progress;
            timeDisplay.innerText = `${formatTime(audioElem.currentTime)} / ${formatTime(audioElem.duration)}`;
        });

        seekBar.addEventListener('input', () => {
            if(!audioElem.duration) return;
            audioElem.currentTime = (seekBar.value / 100) * audioElem.duration;
        });

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // --- 5. RENDER ENGINE (1920x1080 LANDSCAPE) ---
        function renderFrame() {
            if (!isPlaying) return;
            requestAnimationFrame(renderFrame);

            const currentTime = audioElem.currentTime;
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Frequency Data
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            let bass = (dataArray[0] + dataArray[1] + dataArray[2] + dataArray[3]) / 4;
            let kick = bass > 180 ? (bass - 180) / 75 : 0;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background (If available)
            if (bgImg.complete && bgImg.naturalWidth !== 0) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.scale(1 + (kick * 0.03), 1 + (kick * 0.03));
                ctx.drawImage(bgImg, -canvas.width/2, -canvas.height/2, canvas.width, canvas.height);
                ctx.restore();
            } else {
                ctx.fillStyle = '#05070f';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Dark Vignette Overlay
            let grad = ctx.createRadialGradient(cx, cy, 300, cx, cy, 1100);
            grad.addColorStop(0, "rgba(0,0,0,0.4)");
            grad.addColorStop(1, "rgba(0,0,0,0.88)");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // MODE 1: 7CLOUDS LYRICS
            if (visualMode === 'lyrics') {
                let activeLyric = "";
                let nextLyric = "";
                
                for (let i = 0; i < syncedLyrics.length; i++) {
                    if (currentTime >= syncedLyrics[i].time) {
                        activeLyric = syncedLyrics[i].text;
                        if (i + 1 < syncedLyrics.length) nextLyric = syncedLyrics[i+1].text;
                    } else break;
                }

                if (nextLyric) {
                    ctx.font = "800 36px 'Montserrat'";
                    ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
                    ctx.textAlign = "center";
                    ctx.fillText(nextLyric, cx, cy + 180);
                }

                if (activeLyric) {
                    ctx.font = "italic 800 85px 'Montserrat'";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
                    ctx.shadowBlur = 30;
                    ctx.shadowOffsetX = 6;
                    ctx.shadowOffsetY = 6;
                    ctx.fillStyle = "#ffffff";
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = "rgba(0, 0, 0, 0.6)";

                    wrapText(ctx, activeLyric.toUpperCase(), cx, cy, canvas.width * 0.82, 105);
                    ctx.shadowBlur = 0;
                }
            } 
            // MODE 2: AUDIO SPECTRUM LINES (Matching your screenshots)
            else if (visualMode === 'lines') {
                
                // 1. Central Glowing Orb
                ctx.save();
                ctx.beginPath();
                let orbRadius = 100 + (kick * 60);
                let orbGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, orbRadius);
                orbGrad.addColorStop(0, "rgba(255, 255, 200, 0.9)");
                orbGrad.addColorStop(0.4, "rgba(255, 200, 0, 0.5)");
                orbGrad.addColorStop(1, "rgba(255, 0, 85, 0)");
                ctx.fillStyle = orbGrad;
                ctx.arc(cx, cy, orbRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 2. Rainbow Arc Particles
                particles.forEach((p, idx) => {
                    p.angle += p.speed;
                    let pX = cx + Math.cos(p.angle) * (p.radius + (kick * 30));
                    let pY = cy + Math.sin(p.angle) * (p.radius * 0.5 + (kick * 15));
                    
                    ctx.beginPath();
                    ctx.fillStyle = `hsl(${(idx * 6 + currentTime * 50) % 360}, 100%, 65%)`;
                    ctx.arc(pX, pY, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                // 3. Central Horizontal Audio Waveform Spectrum Lines
                const numBars = 64;
                const barWidth = 10;
                const spacing = 8;
                const totalWidth = (numBars * (barWidth + spacing));
                const startX = cx - (totalWidth / 2);
                const axisY = cy;

                // Center Axis Line
                ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(startX - 40, axisY);
                ctx.lineTo(startX + totalWidth + 40, axisY);
                ctx.stroke();

                for (let i = 0; i < numBars; i++) {
                    let index = Math.floor(i * (dataArray.length / numBars));
                    let value = dataArray[index] || 0;
                    let barHeight = (value / 255) * 180;

                    let x = startX + i * (barWidth + spacing);

                    ctx.fillStyle = "#ffffff";
                    ctx.shadowColor = "rgba(255, 255, 255, 0.8)";
                    ctx.shadowBlur = 10;

                    // Dual direction vertical bars radiating from center horizontal axis
                    ctx.fillRect(x, axisY - (barHeight / 2), barWidth, barHeight);
                }
                ctx.shadowBlur = 0;

                // 4. Track Metadata Below Line (NCS Style)
                ctx.font = "700 48px 'Montserrat'";
                ctx.fillStyle = "#ffffff";
                ctx.textAlign = "center";
                ctx.fillText(songTitle, cx, axisY + 140);

                ctx.font = "600 28px 'Montserrat'";
                ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
                ctx.fillText(artistName, cx, axisY + 190);
            }
        }

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            let linesArray = [];

            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                    linesArray.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            linesArray.push(line);

            let startY = y - ((linesArray.length - 1) * lineHeight) / 2;
            for(let k = 0; k < linesArray.length; k++) {
                ctx.fillText(linesArray[k], x, startY + (k * lineHeight));
                ctx.strokeText(linesArray[k], x, startY + (k * lineHeight));
            }
        }
    </script>
</body>
</html>
