<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO 3D WEBGL SPECTRUM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #030308;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-overlay {
            position: absolute;
            bottom: 30px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            background: rgba(10, 10, 20, 0.6);
            padding: 20px 30px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        button {
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            border: none;
            color: white;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(112, 0, 255, 0.8);
        }
        .info {
            font-size: 12px;
            color: #a0a0c0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
    <!-- Three.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GSAP for Smooth Motion Interpolation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <div class="info" id="track-info">AURA // HYPER-SMOOTH WEBGL SPECTRUM</div>
        <div class="controls">
            <button id="playBtn">▶ PLAY TRACK</button>
        </div>
    </div>

    <script>
        // --- 1. SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030308, 0.002);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 2. AUDIO PIPELINE ---
        let audioCtx, analyser, dataArray, source;
        let isPlaying = false;

        // Sample Track (Royalty-free Phonk / Cyberpunk Stream)
        const audio = new Audio();
        audio.crossOrigin = "anonymous";
        audio.src = "https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=montagem-pr-funk-110191.mp3";

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.82; // Balanced smoothing

            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            dataArray = new Uint8Array(analyser.frequencyBinCount);
        }

        // --- 3. SPECTRUM MESH CREATION (CURVED SPLINE SHAPE) ---
        const BARS_COUNT = 120; // High resolution points
        const RADIUS = 5.5;
        const barsGroup = new THREE.Group();
        scene.add(barsGroup);

        // Individual instanced bars forming a 3D glowing ring
        const barGeometry = new THREE.BoxGeometry(0.08, 1, 0.08);
        const barMaterials = [];
        const barMeshes = [];

        for (let i = 0; i < BARS_COUNT; i++) {
            const angle = (i / BARS_COUNT) * Math.PI * 2;
            
            // Dynamic Color Gradient (Cyan to Purple/Magenta)
            const hue = (i / BARS_COUNT) * 0.4 + 0.5; // range 0.5 (cyan) to 0.9 (magenta)
            const color = new THREE.Color().setHSL(hue, 1.0, 0.5);

            const mat = new THREE.MeshBasicMaterial({
                color: color,
                wireframe: false
            });
            barMaterials.push(mat);

            const mesh = new THREE.Mesh(barGeometry, mat);
            
            // Position around circle
            mesh.position.x = Math.cos(angle) * RADIUS;
            mesh.position.y = Math.sin(angle) * RADIUS;
            mesh.rotation.z = angle - Math.PI / 2;

            barsGroup.add(mesh);
            barMeshes.push(mesh);
        }

        // Center Black Core (To mask the inside cleanly)
        const coreGeo = new THREE.CircleGeometry(RADIUS - 0.1, 64);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        coreMesh.position.z = -0.1;
        barsGroup.add(coreMesh);

        // Center Outer Glow Ring
        const ringGeo = new THREE.RingGeometry(RADIUS - 0.05, RADIUS + 0.05, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.position.z = 0.05;
        barsGroup.add(ringMesh);

        // --- 4. FLOATING 3D PARTICLE FIELD ---
        const particleCount = 600;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);

        for(let i = 0; i < particleCount * 3; i += 3) {
            particlePositions[i] = (Math.random() - 0.5) * 40;
            particlePositions[i+1] = (Math.random() - 0.5) * 40;
            particlePositions[i+2] = (Math.random() - 0.5) * 20 - 5;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0x00f0ff,
            size: 0.1,
            transparent: true,
            opacity: 0.6
        });
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        // --- 5. RENDER LOOP & AUDIO ANIMATION ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            let bassKick = 0;

            if (isPlaying && analyser) {
                analyser.getByteFrequencyData(dataArray);

                // Calculate Bass Energy (low frequency bins 0 to 6)
                let bassSum = 0;
                for (let i = 0; i < 6; i++) bassSum += dataArray[i];
                bassKick = bassSum / 6 / 255; // Normalized 0.0 -> 1.0

                // Update Spectrum Bars Symmetrically
                const halfCount = BARS_COUNT / 2;
                
                for (let i = 0; i < halfCount; i++) {
                    // Mirror mapping
                    const rawVal = dataArray[i % 64]; 
                    const height = (rawVal / 255) * 7 + 0.1; // Scale bar height

                    // Right Side
                    const meshRight = barMeshes[i];
                    gsap.to(meshRight.scale, { y: height, duration: 0.05 });

                    // Left Side (Mirror)
                    const meshLeft = barMeshes[BARS_COUNT - 1 - i];
                    gsap.to(meshLeft.scale, { y: height, duration: 0.05 });
                }
            }

            // --- KINETIC AUDIO REACTIVE EFFECTS ---
            // 1. Camera Beat Pump & Slight Orbit
            camera.position.z = 18 - (bassKick * 2.5);
            camera.position.x = Math.sin(time * 0.5) * 0.5;
            camera.position.y = Math.cos(time * 0.3) * 0.5;

            // 2. Center Ring Pulsing & Rotation
            barsGroup.rotation.z = time * 0.1;
            const groupScale = 1 + (bassKick * 0.15);
            barsGroup.scale.set(groupScale, groupScale, groupScale);

            // 3. Particle Flow
            const positions = particleSystem.geometry.attributes.position.array;
            for (let i = 1; i < particleCount * 3; i += 3) {
                positions[i] += 0.02 + (bassKick * 0.08); // Move upward faster on beat
                if (positions[i] > 20) positions[i] = -20;
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        // --- 6. CONTROLS & RESIZE ---
        const playBtn = document.getElementById('playBtn');

        playBtn.addEventListener('click', () => {
            if (!audioCtx) initAudio();

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                playBtn.innerText = "▶ PLAY TRACK";
            } else {
                audio.play();
                isPlaying = true;
                playBtn.innerText = "⏸ PAUSE TRACK";
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
