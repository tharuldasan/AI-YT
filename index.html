<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA // AUTOMATED SHORTS ENGINE</title>
    <style>
        :root {
            --bg: #05070f;
            --card: #0d111d;
            --primary: #00f0ff;
            --text: #f8fafc;
            --border: #1e293b;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .panel {
            background: var(--card);
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 4px; color: var(--primary); font-size: 22px; letter-spacing: 2px; text-transform: uppercase; }
        .subtitle { font-size: 11px; color: #64748b; margin-bottom: 20px; letter-spacing: 1px; }
        label { display: block; margin: 12px 0 6px; font-size: 13px; font-weight: 700; text-transform: uppercase; color: #94a3b8; }
        input[type="text"], input[type="color"], select {
            width: 100%; padding: 12px; background: #05070f; border: 1px solid var(--border);
            border-radius: 6px; color: #fff; box-sizing: border-box; font-size: 14px;
        }
        .search-group { display: flex; gap: 8px; }
        .search-group button { width: auto; white-space: nowrap; }
        .canvas-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border);
            width: 360px; 
            height: 640px; 
            position: relative;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
        }
        canvas { width: 100%; height: 100%; display: block; }
        button {
            width: 100%; padding: 14px; margin-top: 12px;
            background: linear-gradient(135deg, #00f0ff, #0072ff);
            color: #000; border: none; border-radius: 6px; font-weight: 900;
            letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
            transition: all 0.2s ease;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button.record { background: linear-gradient(135deg, #ff0055, #ff0000); color: white; }
        button:disabled { background: #334155; color: #64748b; cursor: not-allowed; transform: none; }
        .file-inputs { margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

    <div class="panel">
        <h1>⚡ AURA ENGINE</h1>
        <div class="subtitle">AUTOMATED VISUALIZER & SHORTS GENERATOR</div>
        
        <label>1. Search Song Online:</label>
        <div class="search-group">
            <input type="text" id="songQuery" placeholder="e.g. Metamorphosis Phonk">
            <button onclick="searchSong()">Search</button>
        </div>

        <div class="file-inputs">
            <label>2. Main Theme Color:</label>
            <input type="color" id="themeColor" value="#00f0ff">

            <label>3. Upload Background Image (Wonder of U Vibe):</label>
            <input type="file" id="bgInput" accept="image/*">

            <label>4. Upload Center Logo (Image 2 / V Badge):</label>
            <input type="file" id="logoInput" accept="image/*">

            <label>Or Local MP3 File:</label>
            <input type="file" id="audioInput" accept="audio/*">
        </div>

        <button id="playBtn" disabled>▶️ PLAY & PREVIEW</button>
        <button id="recordBtn" class="record" disabled>🔴 RECORD SHORTS VIDEO (.WEBM)</button>
        <div id="status" style="font-size: 11px; color: #00f0ff; margin-top: 10px; text-align: center;"></div>
    </div>

    <div class="canvas-container">
        <!-- Render resolution strictly set to 1080x1920 vertical -->
        <canvas id="visualizer" width="1080" height="1920"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        // Assets & State
        let bgImg = new Image();
        let logoImg = new Image();
        let particles = [];
        let themeColor = "#00f0ff";

        // Web Audio
        let audioCtx, source, analyser, bassFilter, mediaDest;
        let audioBuffer = null;
        let isPlaying = false;
        let audioUrl = null;

        // Recording
        let mediaRecorder;
        let recordedChunks = [];

        // UI
        const statusTxt = document.getElementById('status');
        const playBtn = document.getElementById('playBtn');
        const recordBtn = document.getElementById('recordBtn');

        // Init Particles
        for(let i = 0; i < 70; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 4 + 1,
                speedY: Math.random() * -3 - 1,
                speedX: Math.random() * 2 - 1,
                opacity: Math.random()
            });
        }

        // Color Sync Listener
        document.getElementById('themeColor').addEventListener('input', (e) => {
            themeColor = e.target.value;
            document.documentElement.style.setProperty('--primary', themeColor);
        });

        // Image Loaders
        document.getElementById('bgInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) bgImg.src = URL.createObjectURL(file);
        });
        document.getElementById('logoInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) logoImg.src = URL.createObjectURL(file);
        });

        // Online Song Search (iTunes Preview API - Zero Key Required)
        async function searchSong() {
            const query = document.getElementById('songQuery').value;
            if(!query) return;
            statusTxt.innerText = "Searching online audio...";

            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=1`);
                const data = await res.json();
                
                if(data.results.length === 0) {
                    statusTxt.innerText = "No track found. Try local file upload.";
                    return;
                }

                const track = data.results[0];
                statusTxt.innerText = `Loaded: ${track.trackName} - ${track.artistName}`;
                
                // Fetch Audio Stream
                const audioRes = await fetch(track.previewUrl);
                const arrayBuffer = await audioRes.arrayBuffer();
                
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                
                playBtn.disabled = false;
            } catch(err) {
                statusTxt.innerText = "Error fetching song: " + err.message;
            }
        }

        // Local Audio Loader
        document.getElementById('audioInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            statusTxt.innerText = "Decoding local audio file...";
            
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await file.arrayBuffer();
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            
            playBtn.disabled = false;
            statusTxt.innerText = "Local file loaded!";
        });

        // Setup Audio Pipeline
        function setupAudio() {
            source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;

            // Bass Boost Node
            bassFilter = audioCtx.createBiquadFilter();
            bassFilter.type = "lowshelf";
            bassFilter.frequency.value = 120;
            bassFilter.gain.value = 15;

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 128;
            analyser.smoothingTimeConstant = 0.75;

            mediaDest = audioCtx.createMediaStreamDestination();

            source.connect(bassFilter);
            bassFilter.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.connect(mediaDest);
        }

        // Play / Pause Logic
        playBtn.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) {
                source.stop();
                isPlaying = false;
                playBtn.innerText = "▶️ PLAY & PREVIEW";
                recordBtn.disabled = true;
            } else {
                setupAudio();
                source.start(0);
                isPlaying = true;
                playBtn.innerText = "⏸️ STOP AUDIO";
                recordBtn.disabled = false;
                renderFrame();
            }
        });

        // Main Visualizer Render Loop
        function renderFrame() {
            if (!isPlaying) return;
            requestAnimationFrame(renderFrame);

            // Get Frequency Data
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            // Calculate Bass Kick Intensity (Low bins 0 to 6)
            let bassSum = 0;
            for(let i = 0; i < 6; i++) bassSum += dataArray[i];
            let bassIntensity = bassSum / 6; // 0 to 255
            let kick = bassIntensity > 180 ? (bassIntensity - 180) / 75 : 0; // 0.0 to 1.0

            // 1. Camera Shake Effect
            ctx.save();
            let shakeX = (Math.random() - 0.5) * kick * 35;
            let shakeY = (Math.random() - 0.5) * kick * 35;
            ctx.translate(shakeX, shakeY);

            // 2. Background Drawing (Cover Fit Without Distortion)
            if (bgImg.src && bgImg.complete) {
                let scale = Math.max(canvas.width / bgImg.width, canvas.height / bgImg.height);
                let x = (canvas.width / 2) - (bgImg.width / 2) * scale;
                let y = (canvas.height / 2) - (bgImg.height / 2) * scale;
                ctx.drawImage(bgImg, x, y, bgImg.width * scale, bgImg.height * scale);
            } else {
                ctx.fillStyle = "#05070f";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 3. Color Tint Overlay
            ctx.fillStyle = themeColor;
            ctx.globalCompositeOperation = "color";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = "source-over";

            // 4. Strobe / Flicker Effect on Bass Drop
            if(kick > 0.4) {
                ctx.fillStyle = `rgba(255, 255, 255, ${kick * 0.25})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 5. Particles Engine
            ctx.fillStyle = themeColor;
            for(let p of particles) {
                p.y += p.speedY - (kick * 3);
                p.x += p.speedX;
                if(p.y < 0) p.y = canvas.height;
                if(p.x < 0 || p.x > canvas.width) p.x = Math.random() * canvas.width;

                ctx.globalAlpha = p.opacity;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size + (kick * 2), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // 6. Circular Spectrum Center Math
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const baseRadius = 220 + (kick * 40); // Pulsing base circle

            // Black Inner Ring Background
            ctx.beginPath();
            ctx.arc(cx, cy, baseRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#000000";
            ctx.shadowBlur = 40 + (kick * 50);
            ctx.shadowColor = themeColor;
            ctx.fill();
            ctx.shadowBlur = 0; // reset glow

            // Outer Glow Layer
            ctx.strokeStyle = themeColor;
            ctx.lineWidth = 6;
            ctx.stroke();

            // 7. Circular Audio Spectrum Bars
            const numBars = 64;
            const step = (Math.PI * 2) / numBars;

            for (let i = 0; i < numBars; i++) {
                let val = dataArray[i % bufferLength];
                let barHeight = (val / 255) * 200 * (1 + kick);

                let angle = i * step;
                let x1 = cx + Math.cos(angle) * baseRadius;
                let y1 = cy + Math.sin(angle) * baseRadius;
                let x2 = cx + Math.cos(angle) * (baseRadius + barHeight);
                let y2 = cy + Math.sin(angle) * (baseRadius + barHeight);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = themeColor;
                ctx.lineWidth = 8;
                ctx.lineCap = "round";
                ctx.stroke();
            }

            // 8. Draw Center Logo (Image 2 / V Badge)
            if (logoImg.src && logoImg.complete) {
                let logoSize = (baseRadius * 1.4);
                ctx.save();
                ctx.beginPath();
                ctx.arc(cx, cy, baseRadius - 10, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(logoImg, cx - logoSize/2, cy - logoSize/2, logoSize, logoSize);
                ctx.restore();
            }

            ctx.restore(); // Restore camera shake matrix
        }

        // Recording Functionality
        recordBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                recordBtn.innerText = "🔴 RECORD SHORTS VIDEO (.WEBM)";
                statusTxt.innerText = "Encoding video file...";
                return;
            }

            const canvasStream = canvas.captureStream(30);
            const combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(), 
                ...mediaDest.stream.getAudioTracks()
            ]);

            mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
            recordedChunks = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `AURA_SHORTS_${Date.now()}.webm`;
                a.click();
                URL.revokeObjectURL(url);
                statusTxt.innerText = "Aura Shorts Video Exported!";
            };

            mediaRecorder.start();
            recordBtn.innerText = "⏹️ STOP & SAVE SHORTS VIDEO";
            statusTxt.innerText = "Recording video in high-quality 1080x1920...";
        });
    </script>
</body>
</html>
