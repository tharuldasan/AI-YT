<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA // 7CLOUDS LYRIC ENGINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070f; --card: #0d111d; --primary: #ff0055;
            --text: #f8fafc; --border: #1e293b;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg); color: var(--text);
            margin: 0; padding: 20px; display: flex; gap: 20px;
            justify-content: center; flex-wrap: wrap; align-items: flex-start;
        }
        .panel {
            background: var(--card); padding: 24px; border-radius: 12px;
            width: 100%; max-width: 400px; border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 4px; color: var(--primary); font-size: 20px; letter-spacing: 2px; }
        .subtitle { font-size: 11px; color: #64748b; margin-bottom: 20px; letter-spacing: 1px; }
        label { display: block; margin: 12px 0 6px; font-size: 12px; font-weight: 700; color: #94a3b8; }
        input[type="text"] {
            width: 100%; padding: 12px; background: #05070f; border: 1px solid var(--border);
            border-radius: 6px; color: #fff; box-sizing: border-box; font-size: 14px;
        }
        .search-group { display: flex; gap: 8px; }
        button {
            padding: 14px; background: linear-gradient(135deg, var(--primary), #ff7b00);
            color: #fff; border: none; border-radius: 6px; font-weight: 900;
            cursor: pointer; text-transform: uppercase; width: 100%; margin-top: 12px;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        .search-group button { width: auto; }
        
        .canvas-container {
            background: #000; border-radius: 12px; overflow: hidden;
            border: 2px solid var(--border);
            /* Scaled down for UI viewing, but internal resolution is 1920x1080 */
            width: 854px; height: 480px; 
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.15);
        }
        canvas { width: 100%; height: 100%; display: block; }
        #status { font-size: 11px; color: var(--primary); margin-top: 10px; text-align: center; height: 30px;}
        .lyric-box { font-size: 11px; color: #94a3b8; margin-top: 15px; max-height: 100px; overflow-y: auto; background: #05070f; padding: 10px; border-radius: 6px;}
    </style>
</head>
<body>

    <div class="panel">
        <h1>AURA // LYRIC ENGINE</h1>
        <div class="subtitle">16:9 LANDSCAPE • GENERATIVE BG • AUTO-SYNC</div>
        
        <label>Search Song (Artist & Title):</label>
        <div class="search-group">
            <input type="text" id="songQuery" placeholder="e.g. Faded Alan Walker">
            <button onclick="fetchSongData()">Search</button>
        </div>

        <div id="status">Waiting for search...</div>
        
        <div class="lyric-box" id="lyricPreview">Lyrics will appear here...</div>

        <button id="playBtn" disabled>▶️ PLAY VIDEO</button>
    </div>

    <div class="canvas-container">
        <!-- Strictly set to 1920x1080 Landscape -->
        <canvas id="visualizer" width="1920" height="1080"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const statusTxt = document.getElementById('status');
        const playBtn = document.getElementById('playBtn');

        let bgImg = new Image();
        let audioCtx, source, analyser;
        let audioBuffer = null;
        let isPlaying = false;
        let startTime = 0;
        
        let syncedLyrics = [];
        let currentLyricIndex = -1;

        // Ensure font is loaded before drawing
        document.fonts.load("800 60px 'Montserrat'").then(() => {
            drawIdleState();
        });

        function drawIdleState() {
            ctx.fillStyle = '#05070f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#1e293b';
            ctx.font = "800 40px 'Montserrat'";
            ctx.textAlign = 'center';
            ctx.fillText("READY TO GENERATE", canvas.width/2, canvas.height/2);
        }

        async function fetchSongData() {
            const query = document.getElementById('songQuery').value;
            if(!query) return;
            
            playBtn.disabled = true;
            statusTxt.innerHTML = "Fetching Audio & Lyrics...<br>Please wait.";
            syncedLyrics = [];

            try {
                // 1. Fetch Audio from iTunes
                const itunesRes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=1`);
                const itunesData = await itunesRes.json();
                
                if(itunesData.results.length === 0) {
                    statusTxt.innerText = "Error: Song audio not found.";
                    return;
                }
                const track = itunesData.results[0];
                const safeQuery = `${track.trackName} ${track.artistName}`;

                // 2. Fetch Synced Lyrics from LRCLIB
                const lrcRes = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(safeQuery)}`);
                const lrcData = await lrcRes.json();
                
                const lyricTrack = lrcData.find(t => t.syncedLyrics);
                if (lyricTrack) {
                    parseLRC(lyricTrack.syncedLyrics);
                    document.getElementById('lyricPreview').innerText = lyricTrack.syncedLyrics;
                } else {
                    document.getElementById('lyricPreview').innerText = "No synced lyrics found for this track. Instrumental mode.";
                }

                // 3. Generate Unofficial Background via Pollinations AI
                // We add prompt keywords to ensure a beautiful, lyric-video style landscape
                statusTxt.innerHTML = "Generating AI Background...<br>This takes a moment.";
                const aiPrompt = `${track.trackName} ${track.artistName} aesthetic cinematic landscape dark atmospheric wallpaper hd`;
                bgImg.crossOrigin = "anonymous";
                bgImg.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(aiPrompt)}?width=1920&height=1080&nologo=true`;

                // 4. Download and Decode Audio
                const audioRes = await fetch(track.previewUrl);
                const arrayBuffer = await audioRes.arrayBuffer();
                
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                bgImg.onload = () => {
                    statusTxt.innerHTML = `Loaded: ${track.trackName}<br>Ready to Play.`;
                    playBtn.disabled = false;
                };

            } catch(err) {
                statusTxt.innerText = "Error: " + err.message;
            }
        }

        // Parses standard .lrc format [mm:ss.xx] Lyric text
        function parseLRC(lrcString) {
            syncedLyrics = [];
            const lines = lrcString.split('\n');
            const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
            
            for (let line of lines) {
                const match = line.match(regex);
                if (match) {
                    const minutes = parseInt(match[1]);
                    const seconds = parseInt(match[2]);
                    const ms = parseInt(match[3].padEnd(3, '0'));
                    const timeInSeconds = (minutes * 60) + seconds + (ms / 1000);
                    const text = match[4].trim();
                    
                    if (text) {
                        syncedLyrics.push({ time: timeInSeconds, text: text });
                    }
                }
            }
        }

        function setupAudio() {
            source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.8;
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
        }

        playBtn.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) {
                source.stop();
                isPlaying = false;
                playBtn.innerText = "▶️ PLAY VIDEO";
            } else {
                setupAudio();
                source.start(0);
                startTime = audioCtx.currentTime;
                isPlaying = true;
                playBtn.innerText = "⏸️ STOP VIDEO";
                renderFrame();
            }
        });

        // Smart text wrapping function for lyrics
        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            let linesArray = [];

            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    linesArray.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            linesArray.push(line);

            // Center vertically based on number of lines
            let startY = y - ((linesArray.length - 1) * lineHeight) / 2;

            for(let k = 0; k < linesArray.length; k++) {
                ctx.fillText(linesArray[k], x, startY + (k * lineHeight));
                ctx.strokeText(linesArray[k], x, startY + (k * lineHeight));
            }
        }

        function renderFrame() {
            if (!isPlaying) return;
            requestAnimationFrame(renderFrame);

            const currentTime = audioCtx.currentTime - startTime;
            
            // Stop if audio is done
            if (currentTime >= audioBuffer.duration) {
                isPlaying = false;
                playBtn.innerText = "▶️ PLAY VIDEO";
                return;
            }

            // Audio Analysis for subtle background pulsing
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            let bass = (dataArray[0] + dataArray[1] + dataArray[2]) / 3;
            let kickPump = bass > 200 ? (bass - 200) / 100 : 0;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Background with subtle audio-reactive scale
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const scale = 1 + (kickPump * 0.05);
            
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(scale, scale);
            ctx.drawImage(bgImg, -canvas.width/2, -canvas.height/2, canvas.width, canvas.height);
            ctx.restore();

            // 2. Smart Cinematic Vignette (Ensures text readability everywhere)
            let grad = ctx.createRadialGradient(cx, cy, 200, cx, cy, 1200);
            grad.addColorStop(0, "rgba(0,0,0,0.3)");
            grad.addColorStop(1, "rgba(0,0,0,0.85)");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 3. Find current lyric
            let activeLyric = "";
            let nextLyric = "";
            
            for (let i = 0; i < syncedLyrics.length; i++) {
                if (currentTime >= syncedLyrics[i].time) {
                    activeLyric = syncedLyrics[i].text;
                    if (i + 1 < syncedLyrics.length) {
                        nextLyric = syncedLyrics[i+1].text;
                    }
                } else {
                    break;
                }
            }

            // 4. Draw Next Lyric (Faded, Smaller, above or below)
            if (nextLyric) {
                ctx.font = "800 40px 'Montserrat'";
                ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
                ctx.textAlign = "center";
                ctx.shadowBlur = 0;
                ctx.fillText(nextLyric, cx, cy + 180);
            }

            // 5. Draw Active Lyric (7clouds style: Bold, Center, Drop Shadow)
            if (activeLyric) {
                ctx.font = "italic 800 85px 'Montserrat'";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                // Heavy shadows for readability
                ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
                ctx.shadowBlur = 25;
                ctx.shadowOffsetX = 8;
                ctx.shadowOffsetY = 8;

                ctx.fillStyle = "#ffffff";
                
                // Subtle stroke to cut through bright backgrounds
                ctx.lineWidth = 3;
                ctx.strokeStyle = "rgba(0,0,0,0.5)";

                // Analyze constraints: Max width is 80% of canvas
                const maxTextWidth = canvas.width * 0.8;
                wrapText(ctx, activeLyric.toUpperCase(), cx, cy, maxTextWidth, 100);
                
                ctx.shadowBlur = 0; // reset
            }
        }
    </script>
</body>
</html>
