<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA // STUDIO ENGINE V3</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070f;
            --card: #0d111d;
            --primary: #ff0055;
            --accent: #00f0ff;
            --text: #f8fafc;
            --border: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        
        /* Control Panel */
        .panel {
            background: var(--card);
            padding: 20px;
            border-radius: 14px;
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--border);
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        h1 { color: var(--primary); font-size: 18px; letter-spacing: 1.5px; text-transform: uppercase; }
        .subtitle { font-size: 11px; color: #64748b; letter-spacing: 1px; margin-top: -8px; }
        
        label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; display: block; margin-bottom: 4px; }
        
        input[type="text"], input[type="file"], input[type="range"], select {
            width: 100%; padding: 10px; background: #05070f; border: 1px solid var(--border);
            border-radius: 8px; color: #fff; font-size: 12px; outline: none;
        }
        
        .search-group { display: flex; gap: 8px; }
        
        button {
            padding: 10px 16px; background: linear-gradient(135deg, var(--primary), #ff7b00);
            color: #fff; border: none; border-radius: 8px; font-weight: 800;
            cursor: pointer; text-transform: uppercase; transition: all 0.2s ease; font-size: 11px;
        }
        button:hover { opacity: 0.9; }
        
        /* Mode Selector */
        .mode-selector {
            display: flex; gap: 8px; background: #05070f; padding: 4px; border-radius: 8px; border: 1px solid var(--border);
        }
        .mode-btn {
            flex: 1; background: transparent; color: #64748b; padding: 8px; border-radius: 6px; font-size: 11px; text-align: center; cursor: pointer; font-weight: 700;
        }
        .mode-btn.active { background: var(--primary); color: #fff; }

        /* Video Canvas Player */
        .player-wrapper { display: flex; flex-direction: column; gap: 8px; }
        .canvas-container {
            background: #000; border-radius: 14px; overflow: hidden;
            border: 2px solid var(--border);
            width: 854px; height: 480px; /* Scaled 16:9 view */
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.1);
            position: relative;
        }
        canvas { width: 100%; height: 100%; display: block; }

        /* YouTube Scrubber Line */
        .yt-scrubber-container {
            width: 854px; background: var(--card); padding: 12px 16px; border-radius: 10px;
            border: 1px solid var(--border); display: flex; align-items: center; gap: 12px;
        }
        .time-display { font-size: 12px; font-family: monospace; color: var(--accent); min-width: 90px; }
        input[type="range"].scrubber {
            flex: 1; -webkit-appearance: none; appearance: none; height: 6px; padding: 0;
            background: #1e293b; border-radius: 3px; cursor: pointer;
        }
        input[type="range"].scrubber::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
            border-radius: 50%; background: var(--primary); cursor: pointer; transition: transform 0.1s;
        }
        input[type="range"].scrubber::-webkit-slider-thumb:hover { transform: scale(1.3); }

        #status { font-size: 11px; color: var(--accent); text-align: center; min-height: 18px; }
    </style>
</head>
<body>

    <!-- CONTROL PANEL -->
    <div class="panel">
        <h1>⚡ AURA STUDIO</h1>
        <div class="subtitle">DUAL MODE • ALBUM ART SYNC • AUDIO MIRROR</div>
        
        <label>1. Visual Mode:</label>
        <div class="mode-selector">
            <div class="mode-btn active" id="btnModeLyrics" onclick="setVisualMode('lyrics')">🎤 Lyrics Mode</div>
            <div class="mode-btn" id="btnModeLines" onclick="setVisualMode('lines')">🎵 Audio Lines Mode</div>
        </div>

        <label>2. Search Song (Auto-fetches Audio & Album Art):</label>
        <div class="search-group">
            <input type="text" id="songQuery" placeholder="e.g. Limitless Elektronomia">
            <button onclick="searchMusic()">Search</button>
        </div>

        <label>3. Local Audio File (For Full Length):</label>
        <input type="file" id="fullMp3Input" accept="audio/*">

        <label>4. Line Frequency (Density):</label>
        <input type="range" id="freqSlider" min="32" max="256" step="32" value="128">

        <label>5. Line Height (Amplitude):</label>
        <input type="range" id="ampSlider" min="0.5" max="3" step="0.1" value="1.5">

        <label>6. Color Genre:</label>
        <select id="genreSelect">
            <option value="edm">EDM (Pink/Cyan)</option>
            <option value="phonk">Phonk (Red/Purple)</option>
            <option value="funk">Funk (Gold/Teal)</option>
            <option value="ncs" selected>NCS (Cyan Wave)</option>
        </select>

        <div id="status">Awaiting Input...</div>
        <button id="playBtn">▶️ PLAY VIDEO</button>
    </div>

    <!-- PLAYER CANVAS -->
    <div class="player-wrapper">
        <div class="canvas-container">
            <canvas id="visualizer" width="1920" height="1080"></canvas>
        </div>

        <div class="yt-scrubber-container">
            <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
            <input type="range" class="scrubber" id="seekBar" value="0" min="0" max="100" step="0.1">
        </div>
    </div>

    <audio id="audioElement" crossorigin="anonymous"></audio>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const audioElem = document.getElementById('audioElement');
        const statusTxt = document.getElementById('status');
        const playBtn = document.getElementById('playBtn');
        const seekBar = document.getElementById('seekBar');
        const timeDisplay = document.getElementById('timeDisplay');
        
        const freqSlider = document.getElementById('freqSlider');
        const ampSlider = document.getElementById('ampSlider');
        const genreSelect = document.getElementById('genreSelect');

        let audioCtx, source, analyser;
        let isPlaying = false;
        let visualMode = 'lyrics';
        
        let bgImg = new Image();
        let syncedLyrics = [];
        let songTitle = "Awaiting Audio";
        let artistName = "System";

        // Toggle Modes
        function setVisualMode(mode) {
            visualMode = mode;
            document.getElementById('btnModeLyrics').classList.toggle('active', mode === 'lyrics');
            document.getElementById('btnModeLines').classList.toggle('active', mode === 'lines');
        }

        // Draw initial blank state
        ctx.fillStyle = '#05070f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // --- SEARCH MUSIC & MATCH BACKGROUND ---
        async function searchMusic() {
            const query = document.getElementById('songQuery').value;
            if(!query) return;

            statusTxt.innerText = "Searching for track and artwork...";
            try {
                // Fetch iTunes Data for high-res album art and audio preview
                const itunesRes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=1`);
                const itunesData = await itunesRes.json();

                if(itunesData.results.length > 0) {
                    const track = itunesData.results[0];
                    songTitle = track.trackName;
                    artistName = track.artistName;

                    // Get High-Res 1000x1000 Album Art
                    let highResArt = track.artworkUrl100.replace('100x100bb', '1000x1000bb');
                    bgImg.crossOrigin = "anonymous";
                    bgImg.src = highResArt;

                    // Use preview URL if no local file is uploaded
                    if(!document.getElementById('fullMp3Input').files.length) {
                        audioElem.src = track.previewUrl;
                    }
                }

                // Fetch Lyrics
                const lrcRes = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`);
                const lrcData = await lrcRes.json();

                if(lrcData.length > 0 && lrcData[0].syncedLyrics) {
                    parseLRC(lrcData[0].syncedLyrics);
                    statusTxt.innerText = "Match Found! Audio, Artwork & Lyrics loaded.";
                } else {
                    statusTxt.innerText = "Match Found! Audio & Artwork loaded (No synced lyrics).";
                }

                initAudioContext();
            } catch(err) {
                statusTxt.innerText = "Search Error: " + err.message;
            }
        }

        // --- LOCAL FILE ---
        document.getElementById('fullMp3Input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            audioElem.src = URL.createObjectURL(file);
            songTitle = file.name.replace(/\.[^/.]+$/, "");
            artistName = "Local Upload";
            initAudioContext();
            statusTxt.innerText = "Full Local Audio Loaded!";
        });

        function parseLRC(lrcString) {
            syncedLyrics = [];
            const lines = lrcString.split('\n');
            const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
            for (let line of lines) {
                const match = line.match(regex);
                if (match) {
                    const time = (parseInt(match[1]) * 60) + parseInt(match[2]) + (parseInt(match[3].padEnd(3, '0')) / 1000);
                    const text = match[4].trim();
                    if (text) syncedLyrics.push({ time, text });
                }
            }
        }

        // --- AUDIO ENGINE ---
        function initAudioContext() {
            if(!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                source = audioCtx.createMediaElementSource(audioElem);
                analyser = audioCtx.createAnalyser();
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
            }
            analyser.fftSize = parseInt(freqSlider.value) * 2;
        }

        freqSlider.addEventListener('input', () => {
            if (analyser) analyser.fftSize = parseInt(freqSlider.value) * 2;
        });

        playBtn.addEventListener('click', () => {
            if(!audioElem.src) return;
            initAudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) {
                audioElem.pause();
                isPlaying = false;
                playBtn.innerText = "▶️ PLAY VIDEO";
            } else {
                audioElem.play();
                isPlaying = true;
                playBtn.innerText = "⏸️ PAUSE VIDEO";
                renderFrame();
            }
        });

        // Scrubber Updates
        audioElem.addEventListener('timeupdate', () => {
            if(!audioElem.duration) return;
            seekBar.value = (audioElem.currentTime / audioElem.duration) * 100;
            timeDisplay.innerText = `${formatTime(audioElem.currentTime)} / ${formatTime(audioElem.duration)}`;
        });
        seekBar.addEventListener('input', () => {
            if(audioElem.duration) audioElem.currentTime = (seekBar.value / 100) * audioElem.duration;
        });
        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // --- VISUAL RENDER ENGINE ---
        function renderFrame() {
            if (!isPlaying) return;
            requestAnimationFrame(renderFrame);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const currentTime = audioElem.currentTime;

            // Clear Frame cleanly to avoid white bleed
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Background Image (Covering the Canvas)
            if (bgImg.complete && bgImg.naturalWidth !== 0) {
                const imgAspect = bgImg.naturalWidth / bgImg.naturalHeight;
                const canvasAspect = canvas.width / canvas.height;
                let drawW, drawH;
                if (imgAspect > canvasAspect) {
                    drawH = canvas.height; drawW = canvas.height * imgAspect;
                } else {
                    drawW = canvas.width; drawH = canvas.width / imgAspect;
                }
                ctx.drawImage(bgImg, (canvas.width - drawW) / 2, (canvas.height - drawH) / 2, drawW, drawH);
            } else {
                ctx.fillStyle = '#05070f';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Vignette Overlay
            let grad = ctx.createRadialGradient(cx, cy, 300, cx, cy, 1200);
            grad.addColorStop(0, "rgba(0,0,0,0.5)");
            grad.addColorStop(1, "rgba(0,0,0,0.95)");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            // --- MODE: LYRICS ---
            if (visualMode === 'lyrics') {
                let activeLyric = "";
                for (let i = 0; i < syncedLyrics.length; i++) {
                    if (currentTime >= syncedLyrics[i].time) activeLyric = syncedLyrics[i].text;
                    else break;
                }

                if (activeLyric) {
                    ctx.font = "italic 800 85px 'Montserrat'";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = "#ffffff";
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = "rgba(0, 0, 0, 0.5)";
                    ctx.fillText(activeLyric.toUpperCase(), cx, cy);
                    ctx.strokeText(activeLyric.toUpperCase(), cx, cy);
                    ctx.shadowBlur = 0;
                }
            } 
            // --- MODE: MIRRORED AUDIO LINES ---
            else if (visualMode === 'lines') {
                const numBars = bufferLength / 2; // Use half frequency to fit nicely
                const barWidth = (canvas.width / 2) / numBars;
                const amplitudeMultiplier = parseFloat(ampSlider.value);
                const theme = genreSelect.value;

                for (let i = 0; i < numBars; i++) {
                    // Line Height mapped to amplitude slider
                    let barHeight = (dataArray[i] / 255) * (canvas.height * 0.4) * amplitudeMultiplier;
                    
                    // The Offset from Center
                    let xOffset = i * barWidth;

                    // Theme Colors
                    let ratio = i / numBars;
                    if(theme === 'edm') ctx.fillStyle = `hsl(${180 + ratio * 120}, 100%, 65%)`;
                    else if(theme === 'phonk') ctx.fillStyle = `hsl(${280 + ratio * 80}, 90%, 55%)`;
                    else if(theme === 'funk') ctx.fillStyle = `hsl(${30 + ratio * 140}, 100%, 60%)`;
                    else ctx.fillStyle = `hsl(${180 + ratio * 30}, 100%, 65%)`; // NCS

                    ctx.shadowColor = ctx.fillStyle;
                    ctx.shadowBlur = 15;

                    // Right Side (Center -> Right)
                    ctx.fillRect(cx + xOffset, cy - (barHeight / 2), barWidth - 2, barHeight);
                    // Left Side Mirrored (Center -> Left)
                    ctx.fillRect(cx - xOffset - barWidth, cy - (barHeight / 2), barWidth - 2, barHeight);
                }
                ctx.shadowBlur = 0;

                // Track Info Overlay below lines
                ctx.font = "700 48px 'Montserrat'";
                ctx.fillStyle = "#ffffff";
                ctx.textAlign = "center";
                ctx.fillText(songTitle, cx, cy + 220);
                ctx.font = "600 28px 'Montserrat'";
                ctx.fillStyle = "rgba(255,255,255,0.6)";
                ctx.fillText(artistName, cx, cy + 270);
            }
        }
    </script>
</body>
</html>
