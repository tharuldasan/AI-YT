<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO 3D WEBGL SPECTRUM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #030308;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-overlay {
            position: absolute;
            bottom: 30px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            background: rgba(10, 10, 20, 0.75);
            padding: 20px 30px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        button, label.file-btn {
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            display: inline-block;
        }
        button:hover, label.file-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(112, 0, 255, 0.8);
        }
        input[type="file"] { display: none; }
        .info {
            font-size: 12px;
            color: #a0a0c0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <div class="info" id="track-info">AURA // 3D WEBGL SPECTRUM</div>
        <div class="controls">
            <label class="file-btn">
                📁 LOAD LOCAL MP3
                <input type="file" id="audioInput" accept="audio/*">
            </label>
            <button id="playBtn">▶ PLAY PREVIEW</button>
        </div>
    </div>

    <script>
        // --- 1. SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030308, 0.002);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 2. AUDIO PIPELINE ---
        let audioCtx, analyser, dataArray, source;
        let isPlaying = false;

        const audio = new Audio();
        audio.crossOrigin = "anonymous";
        // Reliable fallback audio stream
        audio.src = "https://actions.google.com/sounds/v1/science_fiction/electronic_circuit_loop.ogg";

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.82;

            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            dataArray = new Uint8Array(analyser.frequencyBinCount);
        }

        // --- 3. SPECTRUM MESH CREATION ---
        const BARS_COUNT = 120;
        const RADIUS = 5.5;
        const barsGroup = new THREE.Group();
        scene.add(barsGroup);

        const barGeometry = new THREE.BoxGeometry(0.08, 1, 0.08);
        const barMeshes = [];

        for (let i = 0; i < BARS_COUNT; i++) {
            const angle = (i / BARS_COUNT) * Math.PI * 2;
            const hue = (i / BARS_COUNT) * 0.4 + 0.5;
            const color = new THREE.Color().setHSL(hue, 1.0, 0.5);

            const mat = new THREE.MeshBasicMaterial({ color: color });
            const mesh = new THREE.Mesh(barGeometry, mat);
            
            mesh.position.x = Math.cos(angle) * RADIUS;
            mesh.position.y = Math.sin(angle) * RADIUS;
            mesh.rotation.z = angle - Math.PI / 2;

            barsGroup.add(mesh);
            barMeshes.push(mesh);
        }

        // Center Black Core
        const coreGeo = new THREE.CircleGeometry(RADIUS - 0.1, 64);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        coreMesh.position.z = -0.1;
        barsGroup.add(coreMesh);

        // Outer Ring
        const ringGeo = new THREE.RingGeometry(RADIUS - 0.05, RADIUS + 0.05, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.position.z = 0.05;
        barsGroup.add(ringMesh);

        // --- 4. PARTICLES ---
        const particleCount = 500;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);

        for(let i = 0; i < particleCount * 3; i += 3) {
            particlePositions[i] = (Math.random() - 0.5) * 40;
            particlePositions[i+1] = (Math.random() - 0.5) * 40;
            particlePositions[i+2] = (Math.random() - 0.5) * 20 - 5;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0x00f0ff, size: 0.1, transparent: true, opacity: 0.6
        });
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        // --- 5. RENDER LOOP ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            let bassKick = 0;

            if (isPlaying && analyser) {
                analyser.getByteFrequencyData(dataArray);

                let bassSum = 0;
                for (let i = 0; i < 6; i++) bassSum += dataArray[i];
                bassKick = bassSum / 6 / 255;

                const halfCount = BARS_COUNT / 2;
                for (let i = 0; i < halfCount; i++) {
                    const rawVal = dataArray[i % 64]; 
                    const height = (rawVal / 255) * 7 + 0.1;

                    gsap.to(barMeshes[i].scale, { y: height, duration: 0.05 });
                    gsap.to(barMeshes[BARS_COUNT - 1 - i].scale, { y: height, duration: 0.05 });
                }
            }

            camera.position.z = 18 - (bassKick * 2.5);
            camera.position.x = Math.sin(time * 0.5) * 0.5;
            camera.position.y = Math.cos(time * 0.3) * 0.5;

            barsGroup.rotation.z = time * 0.1;
            const groupScale = 1 + (bassKick * 0.15);
            barsGroup.scale.set(groupScale, groupScale, groupScale);

            const positions = particleSystem.geometry.attributes.position.array;
            for (let i = 1; i < particleCount * 3; i += 3) {
                positions[i] += 0.02 + (bassKick * 0.08);
                if (positions[i] > 20) positions[i] = -20;
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        // --- 6. CONTROLS ---
        const playBtn = document.getElementById('playBtn');
        const audioInput = document.getElementById('audioInput');

        playBtn.addEventListener('click', () => {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                playBtn.innerText = "▶ PLAY TRACK";
            } else {
                audio.play().then(() => {
                    isPlaying = true;
                    playBtn.innerText = "⏸ PAUSE TRACK";
                }).catch(e => console.error("Audio play error:", e));
            }
        });

        // Local MP3 Loader
        audioInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            audio.src = URL.createObjectURL(file);
            document.getElementById('track-info').innerText = file.name;

            audio.play().then(() => {
                isPlaying = true;
                playBtn.innerText = "⏸ PAUSE TRACK";
            });
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
